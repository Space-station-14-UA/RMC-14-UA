# Projectiles for the ported castes.

- type: entity
  parent: XenoSpitProjectile
  id: XenoVenatorCorrosiveProjectile
  name: corrosive spit
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Xeno/xeno_projectiles.rsi
    layers:
    - state: xeno_acid_strong
      shader: unshaded
  - type: Projectile
    impactEffect: null
    damage:
      types:
        Heat: 35
  - type: ModifyTargetOnHit
    removeExisting: false
    add:
    - type: UserAcided
      armorPiercing: 30
      damage:
        types:
          Heat: 1
      duration: 12
    whitelist:
      components:
      - Marine
  - type: XenoVenatorPoolOnHit
    pool: XenoAcidSprayWeak
  - type: ProjectileMaxRange
    max: 8

- type: entity
  parent: XenoVenatorCorrosiveProjectile
  id: XenoVenatorAcidBlobProjectile
  name: acid blob
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Xeno/xeno_projectiles.rsi
    layers:
    - state: acid_glob
      shader: unshaded
  - type: Projectile
    impactEffect: null
    damage:
      types:
        Heat: 25
  - type: XenoVenatorPoolOnHit
    pool: XenoVenatorAcidBlobPool
    rings: 1
    upgradeDirectHit: true
    randomCrossPattern: true
  - type: DeleteOnFixedDistanceStop

- type: entity
  parent: XenoVenatorCorrosiveProjectile
  id: XenoVenatorBreathProjectile
  name: enzymatic breath
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: null
    damage:
      types:
        Heat: 12
  - type: XenoVenatorPoolOnHit
    pool: XenoAcidSprayWeak

- type: entity
  id: XenoToxicSpitProjectile
  parent: [ XenoSpitImpactSounds, XenoBaseProjectile ]
  name: toxic spit
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Xeno/xeno_projectiles.rsi
    layers:
    - state: neurotoxin
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 16
  - type: XenoToxicSpitProjectile
  - type: RMCProjectileSkipXenos
  - type: XenoProjectile
    deleteOnFriendlyXeno: true
  - type: ProjectileMaxRange
    max: 7
