- type: entity
  id: ActionToggleMarineHud
  name: Перемкнути Інтерфейс Морпіхів
  description: Перемикає відображення інформацію про роль, стан здоров'я та інші штуки морпіхів.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Interface/job_icons/UNMC/command.rsi
      state: hudsquad_co
    iconOn:
      sprite: _RMC14/Interface/job_icons/UNMC/command.rsi
      state: hudsquad_co
  - type: InstantAction
    event: !type:ToggleMarineHudActionEvent

- type: entity
  id: ActionToggleXenoHud
  name: Перемкнути Інтерфейс Ксеноїдів
  description: Перемикає відображення інформації про здоров'я, плазму, феромони та інші штуки ксено.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Interface/Alerts/xeno_health.rsi
      state: health_full
    iconOn:
      sprite: _RMC14/Interface/Alerts/xeno_health.rsi
      state: health_full
  - type: InstantAction
    event: !type:ToggleXenoHudActionEvent

- type: entity
  id: ActionFindParasite
  name: Знайти Паразита
  description: Знаходить вам паразита, за якого можна почати грати.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Actions/observer_actions.rsi
      state: find_parasite
  - type: InstantAction
    event: !type:FindParasiteActionEvent

- type: entity
  id: ActionJoinXeno
  name: Приєднатися як Ксеноїд
  description: Встаньте в "чергу" за вашим майбутнім ксено.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Actions/observer_actions.rsi
      state: join_xeno
    useDelay: 0.5
  - type: InstantAction
    event: !type:JoinXenoActionEvent

- type: entity
  id: ActionToggleVisibility
  name: Перемкнути Видимість
  description: Перемикає видимість вас для вашого друга.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi #TODO Find a better icon
      state: icon
    iconOn:
      sprite: Mobs/Ghosts/ghost_human.rsi #TODO Find a better icon
      state: icon
  - type: InstantAction
    event: !type:ImaginaryFriendToggleVisibilityActionEvent

- type: entity
  id: ActionStopBeingFriends
  name: Покинути Друга
  description: Можливість покинути вашого друга. Ти монстр.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Actions/marine_emplacement_actions.rsi #TODO Find a better icon
      state: cancel_view
  - type: InstantAction
    event: !type:ImaginaryFriendStopBeingFriendsActionEvent
