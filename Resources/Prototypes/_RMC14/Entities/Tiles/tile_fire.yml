- type: entity
  id: RMCTileFire
  name: вогонь
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        layer:
        - MobMask
        hard: false
  - type: Sprite
    sprite: _RMC14/Effects/fire.rsi
    noRot: true
    drawdepth: WallTops
    layers:
    - map: [ "base" ]
      state: red_4
  - type: Clickable
  - type: InteractionOutline
  - type: PointLight
    radius: 5
    color: "#bf6d02"
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: RMCIgniteOnCollide
    maxStacks: 20
    tileDamage:
      types:
        Heat: 0.5
    burnColor: "#EE6515"
  - type: DamageOnCollide
    damageDead: false
    fire: true
    damage:
      types:
        Heat: 45
    ignoreResistances: true
  - type: TileFire
    id: RMCTileFire
    extinguishInstantly: true
    duration: 20
    # Mriya start. Оновлення вогню.
    canSpread: true
    baseSpreadChance: 0.35
    spreadFalloffPerTile: 0.05
    minSpreadChance: 0.02
    distancePenaltyPerTile: 0.2
    maxSpreadDistance: 5
    spreadCheckInterval: 1.5
    maxSpreadsPerCheck: 2
    emptyTileFactor: 0.6
    # Mriya end
    cookOffMultiplier: 1.0 # Mriya. Базова швидкість підриву боєприпасів.
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: red_1 }
          Two: { state: red_2 }
          Three: { state: red_3 }
          Four: { state: red_4 }
  - type: IgnorePredictionHit
  - type: RMCScorchEffectOnSpawn
    decalTag: burnt
    tileLimit: 3
  - type: BlockWeeds

- type: entity
  parent: RMCTileFire
  id: RMCTileFireGreen
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: green_4
  - type: PointLight
    color: "#069420"
  - type: RMCIgniteOnCollide
    maxStacks: 10
    tileDamage:
      types:
        Heat: 1
    armorMultiplier: 0.5
    armorWhitelist:
      components:
      - Xeno
    burnColor: "#00FF00"
  - type: TileFire
    id: RMCTileFireGreen
    duration: 50
    extinguishInstantly: false
    patExtinguishMultiplier: 2
    sprayExtinguishMultiplier: 3
    cookOffMultiplier: 1.6 # Mriya. Napalm B — повільніший підрив боєприпасів.
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.666
    sprintSpeedModifier: 0.666
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: green_1 }
          Two: { state: green_2 }
          Three: { state: green_3 }
          Four: { state: green_4 }

