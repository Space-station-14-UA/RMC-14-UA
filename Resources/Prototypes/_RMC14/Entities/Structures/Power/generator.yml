- type: entity
  id: RMCGeneratorFusionFake
  name: остаточно зруйнований термоядерний реактор С-52
  description: Якщо в тебе нема запасу термоядерного палива, команди професійних інженерів та освіти у сфері ядерної енергетики, то ти наврядч щось з ним зробиш... # Mriya
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
        - LowImpassable
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Power/fusion_reactor.rsi
    layers:
    - state: "off"
      map: [ "base" ]
  - type: Clickable

- type: entity
  parent: RMCGeneratorFusionFake
  id: RMCGeneratorFusion
  name: термоядерний реактор С-52
  description: Високоефективний реактор, який використовує стабільний термоядерний синтез задля вироблення енергії. Має ряд захисних протоколів, що не дадуть йому вибухнути, якщо їх перед цим не вимкнути. Зазвичай використовується на космічних суднах та шатлах, через свої малі розміри та зручність у обслуговуванні. # Mriya
  placement:
    mode: SnapgridCenter
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCombatTechnician
  - type: InteractionOutline
  - type: Appearance
  - type: Corrodible
    isCorrodible: false
  - type: RMCFusionReactor
    watts: 50000
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: GenericVisualizer
    visuals:
      enum.RMCFusionReactorLayers.Layer:
        base:
          Off: { state: "off" }
          Weld: { state: "weld" }
          Wire: { state: "wire" }
          Wrench: { state: "wrench" }
          Ten: { state: "on-10" }
          TwentyFive: { state: "on-25" }
          Fifty: { state: "on-50" }
          SeventyFive: { state: "on-75" }
          Hundred: { state: "on-100" }
          Overloaded: { state: "overloaded" }
  - type: BlockXenoConstruction
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCGeneratorFusion
  id: RMCGeneratorFusionColony
  name: геотермальний генератор Г-11
  description: Термоелектричний генератор розташований на свердловині з фороном. Нескінченна енергія, без зайвих викидів, прямо з під землі, юху!
  components:
  - type: RMCFusionReactor
    watts: 100000
    randomizeDamage: true
  - type: IntelPowerObjective
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Power/geothermal_generator.rsi
  - type: GenericVisualizer
    visuals:
      enum.RMCFusionReactorLayers.Layer:
        base:
          Off: { state: "off" }
          Weld: { state: "weld" }
          Wire: { state: "wire" }
          Wrench: { state: "wrench" }
          Ten: { state: "on-10" }
          TwentyFive: { state: "on-25" }
          Fifty: { state: "on-50" }
          SeventyFive: { state: "on-75" }
          Hundred: { state: "on-100" }
  - type: MarineMapTracked
  - type: XenoMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: generator

- type: entity
  parent: RMCGeneratorFusionColony
  id: RMCGeneratorFusionColonyNoMapIcon
  suffix: No Map Icon
  components:
  - type: RemoveComponents
    components:
    - type: MarineMapTracked
    - type: XenoMapTracked
    - type: TacticalMapTracked
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: generator

- type: entity
  parent: BaseItem
  id: RMCGeneratorFusionCell
  name: універсальний паливний елемент ВЛ-6
  description: Перезаряджуваний паливний елемент з термоядерним паливом для ядерних реакторів моделі С-52 та її модифікацій.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Power/fusion_fuel_cell.rsi
    state: cell-full
  - type: Item
    size: Normal
  - type: RMCFusionCell

- type: entity
  abstract: true
  id: RMCPortableGeneratorBase # TODO RMC14 - Functionality
  parent: [ BaseMachine, SmallConstructibleMachine, StructureWheeled]
  components:
    - type: GuideHelp
      guides:
      - RMCGuideRoleCombatTechnician
    - type: Transform
      anchored: False
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.40,-0.40,0.40,0.40"
          density: 155
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Appearance
    - type: Sprite
      sprite: _RMC14/Structures/Power/generators.rsi
      noRot: true
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:ChangeConstructionNodeBehavior
              node: machineFrame
            - !type:DoActsBehavior
              acts: ["Destruction"]

- type: entity
  parent: RMCPortableGeneratorBase
  id: RMCPortableGenerator
  name: переносний генератор моделі P.A.C.M.A.N.
  description: Портативний генератор для аварійного резервного живлення. Потужно.
  components:
    - type: Sprite
      state: portgen0
    - type: Machine
      board: RMCPortableGeneratorPacmanMachineCircuitBoard

- type: entity
  parent: RMCPortableGeneratorBase
  id: RMCPortableGenerator2
  name: переносний генератор моделі S.U.P.E.R.P.A.C.M.A.N.
  description: Портативний генератор для аварійного резервного живлення. Дуже потужно.
  components:
    - type: Sprite
      state: portgen1
    - type: Machine
      board: RMCPortableGeneratorSuperPacmanMachineCircuitboard
