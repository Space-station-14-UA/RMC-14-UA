- type: entity
  parent: BaseStructureDynamic
  id: RMCCanisterBase
  name: газова каністра
  description: Каністра з газом. Створена, щоб зберігати газ під високим тиском та вона це успішно робить!
  components:
  # Mriya start. Можливість будувати на ньому
  - type: Tag
    tags:
    - Structure
    - AllowXenoConstruction
  # Mriya end
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    state: yellow
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 155
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: null
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # Mriya. 150 в оригіналі
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/spray.ogg
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          RMCCanisterBrokenBase:
            min: 1
            max: 1

