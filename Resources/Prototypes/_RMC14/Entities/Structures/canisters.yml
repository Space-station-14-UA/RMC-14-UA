# Broken
- type: entity
  parent: RMCCanisterBase
  id: RMCCanisterBrokenBase
  name: зламана газова каністра
  description: Зламана каністра, яка колись могла зберігати газ. Абсолютно марна штука тепер...
  components:
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    state: yellow-1
    noRot: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50 # Mriya. 100 в оригіналі
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Anchorable
    flags:
    - Unanchorable
