- type: entity
  id: RMCCalendarBase
  name: настінний календар
  description: Класичний елемент гарного офісу, кухні чи то вашої особистої кімнати. Прекрасна штуковина, на яку можна маніакально дивитися, думаючи про те, скільки вам ще залишилося.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: WallMount
    arc: 360
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
  - type: Sprite
    sprite: _RMC14/Structures/Wallmounts/calendar.rsi
    drawdepth: WallMountedItems
  - type: RMCCalendar
  - type: BlockExamine
    whitelist:
      components:
      - Xeno
  # Mriya start. Бо чому ні?
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25 # 1/4 від прапора
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_RMC14/Effects/laser_cannon.ogg # Схоже ж
          params:
            volume: -5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Mriya end

- type: entity
  parent: RMCCalendarBase
