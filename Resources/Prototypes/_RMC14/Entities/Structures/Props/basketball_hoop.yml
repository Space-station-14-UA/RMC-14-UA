- type: entity
  id: RMCBasketballHoop
  name: basketball hoop
  description: Boom, Shakalaka!
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Structures/basketball_hoop.rsi
    state: hoop
  # Mriya start. Додано можливість ламати
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: StructuralMarine
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Corrodible
  # Mriya end

- type: entity
  parent: RMCBasketballHoop
  id: RMCBasketballHoopAlt
  suffix: Alt
  components:
  - type: Sprite
    state: hoop_alt
