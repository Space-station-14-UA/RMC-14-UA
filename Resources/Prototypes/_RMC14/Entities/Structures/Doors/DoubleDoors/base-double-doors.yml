- type: entity
  abstract: true
  parent:
  - CMBaseDoor
  - CMBaseDoorConstructible
  id: RMCDoubleDoorBase
  name: подвійний шлюз # Mriya
  description: Привітайте, подвійний шлюз! Буквальне "розширення" класичних шлюзів. Тепер у нього зможете одночасно пройти Ви, ваш друг, а також якийсь дивак, який чомусь йде в іншу сторону! Все ще має сильні пневмоприводи та зроблений з товстих сталевих пластин, будьте з ним обережні. # Mriya
  components:
  - type: Sprite
    offset: "0.5, 0.5"
  - type: RMCWeldEffectSource
    startingOffset: 0.45, 0.5
    endingOffset: -0.45, 0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,1.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - FullTileLayer

- type: entity
  parent: RMCDoubleDoorBase
  id: RMCDoubleDoorAlmayerGlass
  name: подвійний скляний шлюз # Mriya
  description: Привітайте, подвійний скляний шлюз! Буквальне "розширення" класичних шлюзів. Тепер у нього зможете одночасно пройти Ви, ваш друг, а також якийсь дивак, який чомусь йде в іншу сторону! Все ще має сильні пневмоприводи та зроблений з товстих сталевих пластин, будьте з ним обережні. Має віконечка, щоб бачити, що знаходиться по іншу його сторону. # Mriya
  suffix: Almayer, Glass
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Airlocks/DoubleDoor/almayer_glass.rsi

- type: entity
  parent: RMCDoubleDoorBase
  id: RMCDoubleDoorAlmayerSolid
