- type: entity
  parent:
  - CMBaseDoor
  - CMBaseDoorConstructible
  id: CMAirlock
  name: шлюз
  description: Привітайте, шлюз! Еволюція класичних дверей з додаванням системи доступу, автоматичного відкриття та закриття, а також герметичністю для використання на об'єктах у відкритому космосі. Мають досить сильний пневмопривід та зроблений з товстих сталеві пластини, будьте з ними обережні. # Mriya
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Airlocks/personal_door.rsi
  - type: Occluder
  - type: PaintableAirlock
    department: CMSquad

- type: entity
