# Glass
- type: entity
  parent: CMAirlock
  id: CMAirlockGlass
  name: скляний шлюз
  description: Привітайте, шлюз! Еволюція класичних дверей з додаванням системи доступу, автоматичного відкриття та закриття, а також герметичністю для використання на об'єктах у відкритому космосі. Мають досить сильний пневмопривід та зроблений з товстих сталеві пластини, будьте з ними обережні. Має віконечка, щоб бачити, що знаходиться по іншу його сторону. # Mriya
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Airlocks/personal_door_glass.rsi
  - type: Door
    occludes: false
  - type: Occluder
    enabled: false
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: Construction
    graph: CMAirlock
    node: glassAirlock
  - type: PaintableAirlock
    group: Glass
  - type: Tag
    tags:
    - GlassAirlock

