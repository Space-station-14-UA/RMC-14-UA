# Flight Crew Vendors #

# Equipment Rack
- type: entity
  parent: ColMarTechBase
  id: ColMarTechDropshipCrewEquipment
  name: КолМорТех автоматизована стійка спорядження Персоналу Шатлів
  description: Автоматизована стійка, під'єднана до величезного сховища зі стандартним спорядженням Пілотів морської піхоти.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessPilot" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/equipment.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMDropshipCrewChief
    - CMPilotDropship
    - CMPilotGunship
    sections:
    # Pilots Section
    - name: Стандартне Спорядження
      jobs:
      - CMPilotDropship
      - CMPilotGunship
      takeAll: CMEquipment
      entries:
      - id: RMCJumpsuitPilotAlt
      - id: CMArmorHelmetM30
      - id: RMCHeadCapPatrol
      - id: CMMRE
    # Dropship Crew Chief Section Start
    - name: Стандартне Спорядження
      jobs:
      - CMDropshipCrewChief
      takeAll: CMEquipment
      entries:
      - id: CMArmorHelmetM30
      - id: RMCHeadCapPatrol
      - id: CMMRE
    # Dropship Crew Chief Section End
    - name: Рукавички
      choices: { CMHands: 1 }
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    # Pilots Section
    - name: Броня
      jobs:
      - CMPilotDropship
      - CMPilotGunship
      choices: { CMArmour: 1 }
      entries:
      - id: RMCArmorVestFlak
      - id: CMArmorM3VLFlakVest
      - id: RMCCoatPilot
      - id: RMCOuterClothingExternalWebbing # Mriya
    # Dropship Crew Chief Section Start
    - name: Броня
      jobs:
      - CMDropshipCrewChief
      choices: { CMArmour: 1 }
      entries:
      - id: RMCArmorVestFlak
      - id: CMArmorM3VLFlakVest
      - id: RMCOuterClothingExternalWebbing # Mriya
    # Dropship Crew Chief Section End
    - name: Особиста Друга Зброя
      choices: { CMSidearm: 1 }
      entries:
      - id: CMWeaponPistolM1984
      - id: RMCMK80
    - name: Ремені
      choices: { CMBelt: 1 }
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
      - id: CMBeltMedicBagFilled
        name: сумка рятувальника зразка М276 (Повна)
        recommended: true
      - id: CMBeltMedicalFilled
        name: ремінь для мед. оснащення зразка М276 (Повний)
        recommended: true
      - id: RMCBeltHolsterSMGPouch
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterM13
      - id: RMCBeltHolsterRevolver
      - id: RMCM82FHolster
      - id: RMCM276ShotgunShellLoadingRig
    - name: Підсумки
      choices: { CMPouches: 2 }
      entries:
      - id: RMCPouchFirstAidInjectors
        name: підсумок першої допомоги (багаторазові автоін'єктори)
        recommended: true
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: підсумок першої допомоги (марля, мазь)
        recommended: true
      - id: RMCPouchFirstAidPills
        name: підсумок першої допомоги (пігулки)
        recommended: true
      - id: RMCPouchFirstResponder
      - id: RMCPouchFlareFilled
        name: підсумок для фаєрів (Повний)
      - id: RMCPouchGeneralLarge
      - id: RMCPouchMagazineLarge
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchShotgunLarge
      - id: RMCPouchMedical
      - id: RMCPouchMedkit
      - id: RMCPouchPistol
      - id: RMCPouchSling
    - name: Аксесуари
      choices: { CMAccessories: 1 }
      entries:
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbingBlack
        recommended: true
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: Окуляри
      choices: { CMGlasses: 1 }
      entries:
      - id: RMCSunglasses
      - id: RMCGlassesMedicalHUDGlasses
      - id: RMCGlassesAviatorsSilver
      - id: RMCGlassesAviators
    - name: Пілотські Візори
      choices: { CMFlightVisor: 1 }
      entries:
      - id: RMCVisorPilotBlack
      - id: RMCVisorPilotDarkblue
      - id: RMCVisorPilotLightblue
      - id: RMCVisorPilotPurple
      - id: RMCVisorPilotRed
      - id: RMCVisorPilotYellow
    - name: Маски
      choices: { CMMasks: 1 }
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather
    - name: Оснащення для Зброї
      entries:
      - id: RMCAttachmentAngledGrip
        points: 10
      - id: RMCAttachmentExtendedBarrel
        points: 10
      - id: RMCAttachmentExtendedCompensator
        points: 10
      - id: RMCAttachmentRecoilCompensatorM13
        points: 10
      - id: RMCAttachmentGyroscopicStabilizer
        points: 10
      - id: RMCAttachmentLaserSight
        points: 10
      - id: RMCAttachmentU7UnderbarrelShotgun # This is called "Masterkey" in flight vend; not sure if accurate.
        points: 10
      - id: RMCAttachmentM13StockSolid
        points: 10
      - id: RMCAttachmentM13StockCollapsible
        points: 10
      - id: RMCAttachmentM42A2CollapsibleStock
        points: 10
      - id: RMCAttachmentM63Stock
        points: 10
      - id: RMCAttachmentM54CStockSolid
        points: 10
      - id: RMCAttachmentRecoilCompensator
        points: 10
      - id: RMCAttachmentS5RedDotSight
        points: 10
      - id: RMCAttachmentS5MicroRedDotSight
        points: 10
      - id: RMCAttachmentS6ReflexSight
        points: 10
      - id: RMCAttachmentSuppressor
        points: 10
      - id: RMCAttachmentSuppressorCompact
        points: 10
      - id: RMCAttachmentVerticalGrip
        points: 10
    - name: Амуніція
      entries:
      - id: CMMagazineRifleM4SPRAP
        points: 10
      - id: CMMagazineRifleM4SPRExt
        points: 10
      - id: CMMagazineSMGM63AP
        points: 10
      - id: CMMagazineSMGM63Ext
        points: 10
      - id: CMMagazineRifleM54CAP
        points: 10
      - id: CMMagazineRifleM54CExt
        points: 10
      - id: RMCSpeedLoader44Marksman
        points: 10
    - name: Приладдя
      entries:
      # - id: CMPOFlightsuit # TODO: Port Flightsuit (not the uniform they normally wear)
      #   points: 10
      - id: CMFireExtinguisherPortable
        #name: Fire Extinguisher (Portable) – Mriya
        points: 5
      - id: RMCPouchGeneralLarge
        points: 15
      - id: RMCPouchMagazineLarge
        points: 15
      - id: RMCScabbardMacheteFilled
        name: чохол для мачете (Повний)
        points: 10
      - id: RMCPouchMacheteFilled
        name: підсумок для мачете (Повний)
        points: 15
      - id: RMCMotionDetector
        points: 15
        recommended: true

# Weapon Rack
- type: entity
  parent: ColMarTechBase
  id: ColMarTechDropshipCrewWeapon
  name: КолМорТех стійка зброї та боєприпасів Персоналу Шатлів
  description: Автоматизована стійка з видачі зброї та боєприпасів, підключена до невеликого сховища стандартної зброї. Доступ мають лише Пілоти.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessPilot" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/guns.rsi
  - type: CMAutomatedVendor
    canManualRestock: true
    ignoreBulkRestockById:
    - RMCBoxShotgunBuckshot
    - RMCBoxShotgunFlechette
    - RMCBoxShotgunSlugs
    jobs:
    - CMDropshipCrewChief
    - CMPilotDropship
    - CMPilotGunship
