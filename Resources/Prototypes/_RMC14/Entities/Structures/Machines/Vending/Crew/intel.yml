- type: entity
  parent: ColMarTechBase
  id: ColMarTechIntelGear
  name: КолМорТех стійка обладнання Офіцера Розвідки
  description: Автоматизована стійка обладнання для Офіцерів Розвідки.
  components:
  - type: AccessReader
    access:
    - [ "RMCAccessCommand" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/intel.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMIntelOfficer
    sections:
    - name: Набір Розвідника (Обов'язково)
      takeAll: RMCIntelSet
      entries:
      - id: RMCVendorBundleIntel
    - name: Інженерне Обладнання
      entries:
      - id: CMAPCElectronics
        points: 5
      - id: RMCExplosivePlastic
        points: 10
      - id: RMCWeldingGoggles
        points: 5
    - name: Особлива Амуніція
      entries:
      - id: CMMagazineRifleM4SPRAP
        points: 10
      - id: CMMagazineSMGM63AP
        points: 10
      - id: CMMagazineSMGM63Ext
        points: 10
      - id: CMMagazineRifleM54CAP
        points: 10
      - id: CMMagazineRifleM54CExt
        points: 10
    - name: Амуніція для Другої Зброї
      entries:
      - id: RMCMagazinePistolM13Ext
        points: 10
      - id: RMCSpeedLoader44Marksman
        points: 10 # TODO RMC14 heavy speed revolver
      - id: RMCMagazinePistolM1984AP
        points: 5
      - id: RMCMagazinePistolM1984HP
        points: 5
      - id: CMMagazinePistolMK80
        points: 10
      - id: RMCMagazinePistolSU6
        points: 10
    - name: Обмежена Зброя
      entries:
      - id: RMCGunCasePistolMK80
        points: 15
      - id: RMCGunCasePistolSmart
        points: 15
    - name: Обмежене Обладнання
      entries:
      - id: CMBeltUtilityCombatFilled
        points: 15
    - name: Підсумки
      entries:
      # Mriya start. Чому ні
      - id: RMCPouchGeneralLarge
        points: 10
      # Mriya end
      - id: RMCPouchMagazineLarge
        points: 10
      - id: RMCPouchShotgunLarge
        points: 10
      - id: RMCPouchAutoinjector
        points: 15
        recommended: true
      - id: RMCPouchMacheteFilled
        name: machete pouch (Full)
        points: 10
    - name: Додаткове Обладнання
      entries:
      - id: CMFireExtinguisherPortable
        points: 5
      - id: RMCFulton20
        points: 10
      # Mriya start. Моніторинг.
      - id: MRMonitoringDevice
        points: 8
      # Mriya end
      - id: RMCMotionDetector
        points: 15
        recommended: true
      - id: RMCIntelDetector
        points: 5
    - name: Біноклі
      entries:
      - id: RMCBinoculars
        points: 5
      - id: RMCRangefinder
        points: 10
      - id: RMCLaserDesignator
        points: 15
    - name: Візори для Шолома
      entries:
      - id: RMCVisorMedical
        points: 5
      - id: RMCVisorWelding
        points: 5
      - id: RMCVisorNightVision
        points: 25
        recommended: true
    - name: Ключі Шифрування
      entries:
      - id: CMEncryptionKeyIntel
        points: 5
    - name: Додатковий Комплект Розвідника
      entries:
      - id: RMCKitIntel
        name: комплект польового розвідника (для нетренованого персоналу)
        points: 20

- type: entity
  parent: ColMarTechBase
  id: ColMarTechIntelEquipment
  name: КолМорТех автоматизована стійка спорядження Офіцера Розвідки
  description: Автоматизована стійка, під'єднана до величезного сховища зі стандартним спорядженням Офіцера Розвідки морської піхоти.
  components:
  - type: AccessReader
    access:
    - [ "RMCAccessCommand" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/equipment.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMIntelOfficer
    sections:
    - name: Стандартне Спорядження
      takeAll: RMCIntelEquipment
      entries:
      - id: CMHeadsetIntel
      - id: CMMRE
    - name: Рукавички
      choices: { CMHands: 1 }
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    - name: Броня
      takeOne: CMArmor
      entries:
      - id: RMCArmorXM4
      - id: RMCArmorM3LightVariants
      - id: RMCArmorVestIntel
    - name: Куртки
      choices: { CMCoat: 1 }
      entries:
      - id: RMCCoatService
    - name: Рюкзаки
      choices: { CMBag: 1 }
      entries:
      - id: CMSatchelMarineIntel
        replaceSlot: back
        recommended: true
      - id: RMCSatchelMarineIntelChestrig
        replaceSlot: back
        recommended: true
      - id: RMCSatchelMarineIntelSatchel
        replaceSlot: back
        recommended: true
      - id: RMCBackpackRTO
        replaceSlot: back
    - name: Шоломи
      choices: { CMHelmet: 1 }
      entries:
      - id: RMCArmorHelmetM12Intel
        recommended: true
    - name: Головні убори
      choices: { CMHat: 1 }
      entries:
      - id: RMCHeadBeretGreen
      - id: CMHeadBeretTan
      - id: CMHeadCapOfficer
    - name: Ремені
      choices: { CMBelt: 1 }
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
        recommended: true
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterSMG
      - id: RMCBeltHolsterRevolver
      - id: RMCBeltHolsterM13
      - id: RMCM276ShotgunShellLoadingRig
      - id: CMBeltUtilityFilled
        name: ремінь для інструментів зразка М276 (Повний)
        recommended: true
    - name: Підсумки
      choices: { CMPouches: 2 }
      entries:
      - id: RMCPouchDocument
        recommended: true
      - id: RMCPouchFirstAidInjectors
        name: підсумок першої допомоги (багаторазові автоін'єктори)
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: підсумок першої допомоги (марля, мазь) # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: підсумок першої допомоги (пігулки)
      - id: RMCPouchFlareFilled
        name: підсумок для фаєрів (Повний)
      - id: RMCPouchFuelTank
      - id: RMCPouchGeneralLarge
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchMagazine
      - id: RMCPouchShotgun
      - id: RMCPouchPistol
      - id: RMCPouchToolsFill
        name: підсумок для інструментів (Повний)
        recommended: true
      - id: RMCPouchSling
    - name: Ремінно-Плечові Системи
      choices: { CMAccessories: 1 }
      entries:
      # Mriya start
      - id: RMCToolWebbingSmallFilled
        name: маленький жилет для інструментів (Повний)
        recommended: true
      # Mriya end
      - id: CMWebbingBlack
      - id: CMWebbingBrown
        recommended: true
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
    - name: Маски
      choices: { CMMask: 1 }
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif

