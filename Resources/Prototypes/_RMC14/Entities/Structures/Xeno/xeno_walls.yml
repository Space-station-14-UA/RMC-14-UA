    state: membrane
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: membrane
  - type: XenoStructureUpgradeable
    to: WallXenoMembraneThick
    cost: 25

- type: entity
  parent: BaseMembraneXeno
  id: WallXenoMembraneThick
  name: густа смоляна мембрана
  description: Дивний чорний густий слиз, що застиг у формі напівпрозорої стіни.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: thickmembrane
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: thickmembrane
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 300
  - type: XenoConstructionPlasmaCost
    plasma: 120
    scalingCost: true

- type: entity
  parent: WallXenoResin
  id: WallXenoResinWeak
  name: слабка смоляна стіна
  description: Дивний чорний слиз, що застиг у формі стіни. Вона виглядає так, ніби ось-ось розвалиться.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # very weak
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: TimedDespawn
    lifetime: 5.0
  - type: XenoStructureUpgradeable
    to: null

- type: entity
  parent: WallXenoResin
  id: WallXenoResinWeedbound
  name: трав'яна смоляна стіна
  description: Дивний чорний слиз, який сильно пов'язаний з травою під ним, що застиг у формі стіни.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleDesigner
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/weedbound_resin_walls.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/weedbound_resin_walls.rsi
    state: weedboundresin
  - type: IconSmooth
    key: walls
    base: weedboundresin
  - type: XenoStructureUpgradeable
    to: WallXenoResinThickWeedbound
    cost: 50
  - type: WeedboundWall

- type: entity
  parent: WallXenoResinThick
  id: WallXenoResinThickWeedbound
  name: густа трав'яна смоляна стіна
  description: Багато дивного чорного слизу, який сильно пов'язаний з травою під ним, що застиг у формі стіни.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleDesigner
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/weedbound_resin_walls.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/weedbound_resin_walls.rsi
    state: thickweedboundresin
  - type: IconSmooth
    key: walls
    base: thickweedboundresin
  - type: WeedboundWall
    isThickVariant: true

- type: entity
  abstract: true
  parent: WallXenoResin
  id: BaseWallXenoResinReflective
  name: відбивна смоляна стіна
  description: Дивний слиз, що застиг у формі дуже гладкої стіни.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/bone_resin.rsi
  - type: Icon
    sprite: _RMC14/Structures/Walls/bone_resin.rsi
    state: bone_resin
  - type: IconSmooth
    key: walls
    base: bone_resin
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: ReflectiveResin
  - type: XenoConstructionPlasmaCost
    plasma: 145
    scalingCost: true
  - type: XenoStructureUpgradeable
    to: null
  - type: RMCReflective
  - type: ExplosionRandomResistance
    min: 0.3
    max: 0.3

- type: entity
  parent: BaseWallXenoResinReflective
  id: WallXenoResinReflective
  components:
  - type: XenoSecretionLimited
    id: WallXenoResinReflective
    amount: 5

- type: entity
  parent: WallXenoResinReflective
  id: WallXenoResinReflectiveUnstable
  name: слабка відбивна смоляна стіна
  description: "Дивний чорний слиз, що застиг у формі дуже гладкої стіни.\nВона виглядає так, ніби ось-ось розвалиться."
  components:
  - type: TimedDespawn
    lifetime: 13.0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
