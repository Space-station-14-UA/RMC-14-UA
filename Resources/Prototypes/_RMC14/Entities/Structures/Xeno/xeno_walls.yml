- type: entity
  parent: CMBaseWallXeno
  id: WallXenoResin
  name: смоляна стіна
  description: Дивний чорний слиз, що застиг у формі стіни.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: resin
  - type: IconSmooth
    key: walls
    base: resin
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: XenoNestSurface
  - type: XenoConstructionMinRange
  - type: XenoConstructionPlasmaCost
    plasma: 120
    scalingCost: true
  - type: XenoStructureUpgradeable
    to: WallXenoResinThick
    cost: 50
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 225

- type: entity
  parent: WallXenoResinThick
  id: WallXenoResinImpenetrable
  name: непроникна смоляна стіна
  description: Абсолютно невразлива. За достатньо часу вона має перейти у звичайний стан.
  suffix: Invincible, 25 minutes
  components:
  - type: InvincibleHiveStructure
    replace: WallXenoResinThick

- type: entity
  parent: DoorXenoResinThick
  id: DoorXenoResinImpenetrable
  name: непроникні смоляні двері
  description: Абсолютно невразливі. За достатньо часу вони має перейти у звичайний стан.
  suffix: Invincible, 25 minutes
  components:
  - type: InvincibleHiveStructure
    replace: DoorXenoResinThick
    blockerId: RMCBlockerMarine

- type: entity
  id: RMCBlockerMarine
  name: marine blocker
  suffix: DO NOT MAP
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - Marine
  - type: XenoStunnedPreventCollision

- type: entity
  parent: WallXenoResin
  id: WallXenoResinThick
  name: густа смоляна стіна
  description: Багато дивного чорного слизу, що застиг у формі стіни.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: thickresin
  - type: IconSmooth
    key: walls
    base: thickresin
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1350
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 338
  - type: XenoConstructionPlasmaCost
    plasma: 170
    scalingCost: true
  - type: XenoStructureUpgradeable
    to: null

- type: entity
  parent: CMBaseWallXeno
  id: BaseMembraneXeno
  name: смоляна мембрана
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
  - type: Occluder
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
        density: 1000
  - type: XenoNestSurface
  - type: XenoConstructionMinRange
  - type: XenoConstructionPlasmaCost
    plasma: 95
    scalingCost: true
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 150

- type: entity
  parent: BaseMembraneXeno
  id: WallXenoMembrane
  name: смоляна мембрана
  description: Дивний чорний слиз, що застиг у формі напівпрозорої стіни.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
