- type: entity
  parent: BaseItem
  id: RMCVehicleKeyBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/vehicle_key.rsi
    state: key
  - type: Item
    size: Tiny
  - type: VehicleKey

- type: entity
  parent: RMCVehicleKeyBase
  id: RMCVehicleKey
  name: ключ від транспорту
  description: Ключ від транспортного засобу, вирізаний для конкретного замка.
  components:
  - type: VehicleKey
    mode: Normal

- type: entity
  parent: RMCVehicleKeyBase
  id: RMCVehicleKeyBlank
  name: пустий ключ від транспорту
  description: Непрограмований ключ від транспорту, який можна відбити на транспортний засіб.
  components:
  - type: VehicleKey
    mode: Blank

- type: entity
  parent: RMCVehicleKeyBase
  id: RMCVehicleKeyDuplicator
  name: дублікат ключа від транспорту
  description: Пустий ключ від транспорту, призначений для копіювання існуючого ключа.
  components:
  - type: VehicleKey
    mode: Duplicator
