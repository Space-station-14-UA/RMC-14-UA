- type: entity
  parent: BaseItem
  id: RMCStunBatonDamaged
  name: пошкоджений електрошоковий кийок # Кийок, бо у це більш офіційний термін для подібних штук (поліцейський/гумовий/складний кийок у поліції)
  description: Електрошоковий кийок для "знешкодження" більшості живих істот. Зазвичай використовується правоохоронними службами, як нелетальний метод затримання. Цей виглядає так, ніби їм пробували забивати цвяхи, особливо в місці кнопки увімкнення/вимкнення...
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/stun_baton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Melee/stun_baton.rsi
    slots:
    - Belt
    - Suitstorage
  - type: Item
    heldPrefix: off
    size: Normal
  - type: Appearance
  - type: GenericVisualizer
    visuals:
     enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: stunbaton_on}
          False: {state: stunbaton_off}

- type: entity
  parent: RMCStunBatonDamaged
  id: CMStunbaton
  name: електрошоковий кийок
  description: Електрошоковий кийок для "знешкодження" більшості живих істот. Зазвичай використовується правоохоронними службами, як нелетальний метод затримання.
  components:
  - type: Stunbaton
    energyPerUse: 50
  - type: RMCStaminaDamageOnHit
    damage: 100
    jitterDuration: 2
  - type: MeleeRequiresSkill
    skills:
      RMCSkillPolice: 1
  - type: StunOnHit
    duration: 20
    whitelist:
      components:
      - Marine
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/egloves.ogg
      params:
        variation: 0.2
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/egloves.ogg
      params:
        variation: 0.2
    activatedDamage:
      types:
        Blunt: 0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 7
    bluntStaminaDamageFactor: 2.0
    angle: 60
    animation: WeaponArcThrust
  - type: RMCStaminaDamageOnCollide
    damage: 35
  - type: LandAtCursor # it deals stamina damage when thrown
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: UseDelay
  - type: DisarmMalus
    malus: 0.225
  - type: GuideHelp
    guides:
    - RMCGuideRoleMilitaryPolice

# TODO RMC14: Actually implement the telescopic baton
- type: entity
  parent: CMStunbaton
  id: RMCTelescopicBaton
  name: телескопічний кийок
  description: Компактна, але ефективна зброя особистого захисту. У складеному вигляді може бути легко покладена в кишеню.
  components:
  - type: Item
    size: Small
