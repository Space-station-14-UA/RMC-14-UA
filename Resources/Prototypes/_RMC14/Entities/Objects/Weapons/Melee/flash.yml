- type: entity
  parent: Flash
  id: CMFlash
  name: спалах
  description: Використовується для того, щоб сліпити мудаків або бути мудаком. Потребує 15 секунд на перезарядку кожного заряду. Має затримку в 1 секунду між використаннями.
  components:
  - type: Flash
    slowTo: 0.25
    meleeStunDuration: 12
    range: 3
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/flash.rsi
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Weapons/Melee/flash.rsi
  - type: LimitedCharges
    maxCharges: 5
    lastCharges: 5
  - type: AutoRecharge
    rechargeDuration: 15
  - type: UseDelay
    delay: 0.5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FlashVisuals.Flashing:
        enum.FlashVisualLayers.LightLayer:
          True: { visible: true }
          False: { visible: false }
  - type: MeleeRequiresSkill
    skills:
      RMCSkillPolice: 1
  - type: GuideHelp
    guides:
    - RMCGuideRoleMilitaryPolice
