- type: entity
  parent: [ RMCBaseWeaponShotgun, RMCBaseAttachableHolder ]
  name: М890 тактичний дробовик
  id: WeaponShotgunM890
  description: Унікальний напівавтоматичний дробовик виробництва Вестон-Ямада з високою скорострільністю та вбудованим підствольним гранатометом. Вміщує 8 дробових набоїв у трубчастий магазин.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/m890.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/m890.rsi
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      collection: RMCTacticalShotgunShoot
  - type: ShootUseDelay
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 5
    scatterUnwielded: 10
    baseFireRate: 0.7
    burstScatterMult: 5
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - RMCShellShotgun
    proto: CMShellShotgunSlugs
    capacity: 8
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-stock:
        startingAttachable: RMCAttachmentM890Stock
        whitelist:
          tags:
          - RMCAttachmentM890Stock
      rmc-aslot-underbarrel:
        locked: true
        startingAttachable: RMCAttachmentU1GrenadeLauncher
        whitelist:
          tags:
          - RMCAttachmentU1GrenadeLauncher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.825, 0.06
      rmc-aslot-rail: -0.035, 0.095
      rmc-aslot-stock: -0.65, 0
      rmc-aslot-underbarrel: 0.34, -0.28

# Riot
