- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: Тип 77 штурмова гвинтівка
  id: RMCWeaponRifleType77
  description: Еквівалент гвинтівки М54С, але від СП. Як така, зброя часто потрапляє до рук найманців та повстанців. Має гіршу за М54 точність, але надійніша в екстремальних умовах. "Гвинтівка Тип 77 все ще буде працювати після того, як її скинули зі скелі та залишили під водою на місяць", – пишуть на пропагандистських постерах СПН. Комуняцьке лайно...
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/Type77.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/Type77.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: RMCType77Shoot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 4
    scatterUnwielded: 11
    baseFireRate: 4
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.3
    accuracyMultiplierUnwielded: 0.65
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleType77
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleType77
          - RMCMagazineRifleType77AP
          - RMCMagazineRifleType77Incendiary
          - RMCMagazineRifleType77HEAP
          - RMCMagazineRifleType77Rubber
  - type: GunDamageModifier
    multiplier: 1.1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        startingAttachable: RMCAttachmentType77StockCollapsible
        whitelist:
          tags:
          - RMCAttachmentType77StockCollapsible
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentVerticalGrip
          - RMCAttachmentUnderbarrelExtinguisher
          - RMCAttachmentMiniFlamethrower
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0
      rmc-aslot-rail: 0, 0.1
      rmc-aslot-stock: -0.65, 0
      rmc-aslot-underbarrel: 0.3, -0.283
  - type: Tag
    tags:
    - RMCWeaponRifleType77
  - type: ItemMapper
    mapLayers:
      mag-0:
        whitelist:
          tags:
          - RMCMagazineRifleType77
      mag-1:
        whitelist:
          tags:
          - RMCMagazineRifleType77AP
      mag-2:
        whitelist:
          tags:
          - RMCMagazineRifleType77Incendiary
      mag-3:
        whitelist:
          tags:
          - RMCMagazineRifleType77HEAP
      mag-4:
        whitelist:
          tags:
          - RMCMagazineRifleType77Rubber

