# Festive

- type: entity
  parent: CMMarinePreparedMealBase
  id: RMCMarinePreparedMealCookies
  name: "морпіхотний готовий Різдвяний пайок: Цукрове печиво"
  description: Страва з цукровим печивом стандарту КМПОН М25. Була розроблена, щоб дати морським піхотинцям відчуття різдвяної радості. Але, на подив Вищого Командування, захід економії коштів з просто виготовленням протеїнових батончиків у формі печива з шоколадною крихтою та заміні молока штучно підфарбованою водою, не сподобався більшості морпіхів.
  components:
  - type: Sprite
    state: cookies
  - type: Food
    transferAmount: 8
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
        - ReagentId: RMCSugar
          Quantity: 9

- type: entity
  parent: CMMarinePreparedMealBase
  id: RMCMarinePreparedMealGingerbread
  name: "морпіхотний готовий Різдвяний пайок: Імбирне печиво"
  description: Страва з імбирним печивом стандарту КМПОН М25. Була розроблена, щоб надати морським піхотинцям зручний та дешевий доступ до імбирного печива, як заміну щорічним курсам з виготовлення імбирного печива через зростання витрат та комічно низький рівень успішності. Однак, через заходи економії коштів, це печиво рідко викликає радість чи святковий настрій.
  components:
  - type: Sprite
    state: gingerbread
  - type: Food
    transferAmount: 8
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
        - ReagentId: RMCSugar
          Quantity: 9

- type: entity
  parent: CMMarinePreparedMealBase
  id: RMCMarinePreparedMealFruitcake
  name: "морпіхотний готовий Різдвяний пайок: Фруктовий кекс"
  description: Фруктовий кекс стандарту КМПОН М25. Був третьою стравою, розробленою офіцерським комітетом у рамках проєкту М25. Це помітно по жахливій твердості хліба та кислості фруктів з родзинками. Можна логічно зробити висновок, що люди, які продавали цей варіант, гірші за Грінча та Скнару разом узятих, а також за тих, хто розробив та приготував цей фруктовий кекс.
  components:
  - type: Sprite
    state: fruit_cake
  - type: Food
    transferAmount: 8
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
        - ReagentId: RMCSugar
          Quantity: 9

