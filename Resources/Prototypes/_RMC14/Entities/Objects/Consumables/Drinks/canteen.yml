- type: entity
  abstract: true
  parent: DrinkBase
  id: CMCanteenBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/canteen.rsi
  - type: Item
    size: Small
  - type: Drink
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 60
        reagents:
        - ReagentId: Water
          Quantity: 60
  - type: Tag
    tags:
    - DrinkGlass
  - type: SolutionTransfer
    transferAmount: 60
    maxTransferAmount: 60
    canChangeTransferAmount: true
    transferAmounts:
    - 5
    - 10
    - 15
    - 25
    - 30
    - 40
    - 60
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RMCFlask

- type: entity
  parent: CMCanteenBase
  id: CMCanteen
  name: військова фляга
  description: "Ви робите ковток зі своєї вірної фляги морпіха...\nНа дні ви помічаєте вирізане ножем число 13."
  components:
  - type: Sprite
    state: canteen

- type: entity
  parent: CMCanteenBase
  id: CMMetalFlask
  name: металева фляга
  description: Металева фляга з високою місткістю.
  suffix: Empty
  components:
  - type: Sprite
    state: flask
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 60

- type: entity
  parent: CMCanteenBase
  id: CMMarineFlask
  name: фляга морпіха
  description: Металева фляга з логотипом КМПОН. Ймовірно заповнена сумішшю води, моторної оливи та медичного спирту.
  components:
  - type: Sprite
    state: flask_marine

- type: entity
  parent: CMCanteenBase
  id: CMWEYAFlask
  name: фляга Ве-Я
  description: Металева фляга з логотипом Ве-Я, яку, ймовірно, замовили лише заради додаткової реклами.
  components:
  - type: Sprite
    state: flask_we_ya

- type: entity
  parent: [CMCanteenBase, DrinkFlaskVisualsOpenable]
  id: RMCWeYaThermos
  name: термос Ве-Я
  description: Елегантний металевий термос, оформлений у кольорах корпорації «Вестон-Ямада». У маркетингових матеріалах заявляється, що він здатен витримати еквівалент ядерного вибуху, хоча це, мабуть, лише піар-кампанія.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Drinks/weya_thermos.rsi
