- type: entity
  id: XenoConstructionGhost
  name: привид будівництва
  description: Попередній перегляд того, що буде побудовано.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    drawdepth: Overlays
    color: "#30FF3080"
    noRot: true

- type: entity
  id: RMCBaseEffectXenoStructure
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: True
  - type: Sprite
    drawdepth: Effects
    sprite: /Textures/_RMC14/Effects/xeno_structure_animations.rsi
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
  - type: TimedDespawn
    lifetime: 5.0
  - type: Tag
    tags:
    - HideContextMenu
  - type: XenoConstructionAnimation

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectWallXenoResinThick
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: thick

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectWallXenoMembraneThick
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: thickmembrane

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectDoorXenoResinThick
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: thickdoor

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectWallXenoResin
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: wall

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectWallXenoResinReflective
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: wall # TODO RMC14 Make this have it's own build animation once the reflective wall stops using the skeletal resin sprite.

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectWallXenoMembrane
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: membrane

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectDoorXenoResin
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
      state: secrete_base
    - map: ["enum.XenoConstructionVisualLayers.Animation"]
      state: door

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectXenoStickyResin
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_RMC14/Effects/xeno_secrete.rsi
    layers:
    - state: secrete_base

- type: entity
  parent: RMCEffectXenoStickyResin
  id: RMCEffectXenoFastResin
  categories: [ HideSpawnMenu ]

- type: entity
  parent: RMCEffectXenoStickyResin
  id: RMCEffectXenoResinSpikes
  categories: [ HideSpawnMenu ]

- type: entity
  parent: RMCBaseEffectXenoStructure
  id: RMCEffectXenoWeedsSource
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_RMC14/Effects/alert.rsi
    layers:
    - state: alert_greyscale
      color: "#A800FF7F"

- type: entity
  parent: RMCEffectXenoWeedsSource
  id: RMCEffectHiveAcidPillarXeno
  categories: [ HideSpawnMenu ]

#Surge
- type: entity
  parent: RMCBaseEffect
  id: XenoSurgeResinWall
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 15
  - type: Sprite
    sprite: /Textures/_RMC14/Structures/Xenos/xeno_surge_glow.rsi
    noRot: true
    drawdepth: Effects
    layers:
      - state: surge-wall
        shader: unshaded
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: XenoSurgeResinWall
  id: XenoSurgeResinDoor
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
      - state: surge-door
        shader: unshaded

- type: entity
  parent: WallXenoResinThick
  id: WallXenoResinQueen
  name: королевська смоляна стіна
  description: Багато дивного слизу, що застиг у формі стіни. Створено та укріплено Королевою за допомогою її здібностей.
  components:
  - type: Sprite

- type: entity
  parent: WallXenoMembraneThick
  id: WallXenoMembraneQueen
  name: королевська смоляна мембрана
  description: Багато дивний слиз, що застиг у формі напівпрозорої стіни.. Створено та укріплено Королевою за допомогою її здібностей.

- type: entity
  parent: DoorXenoResinThick
  id: DoorXenoResinQueen
  name: королівські смоляні двері
  description: Багато дивної чорної смола, що застигла у дуже дивній формі. Створено та укріплено Королевою за допомогою її здібностей.
