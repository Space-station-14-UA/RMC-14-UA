# Synth survivor languages

- type: entity
  id: RMCLanguagePresetSynthColonist
  name: Survivor Synth Colonist Languages
  categories: [ HideSpawnMenu ]
  components:
  - type: LanguagePreset
    spokenLanguages:
    - English
    - French
    - Japanese
    - Russian
    - Scandinavian
    - German
    - Chinese
    - Spanish
    - MREnglish # Mriya. Так.
    understoodLanguages:
    - English
    - French
    - Japanese
    - Russian
    - Scandinavian
    - German
    - Chinese
    - Spanish
    - MREnglish # Mriya. Так.
    currentLanguage: English
    defaultLanguage: English

- type: entity
  id: RMCLanguageLearningPresetSynthColonist
  name: Survivor Synth Colonist Language Learning
  categories: [ HideSpawnMenu ]
  components:
  - type: LanguageLearningPreset
    learnableLanguages:
    - Xeno
    - Hunter # Mriya.
    firstContactLanguages:
    - Xeno
    - Hunter # Mriya.
    languages:
      Xeno:
        initialBoostedWordCount: 18
        initialBoostedWordComprehension: 0.4
      Hunter: # Mriya.
        initialBoostedWordCount: 25
        initialBoostedWordComprehension: 0.3
    comprehensionThreshold: 0.8
    learningRange: 8.0
    baseWordLearningRate: 0.05
