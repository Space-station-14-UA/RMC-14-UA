- type: entity
  parent: CMBaseStructure
  id: PredTrophyVend1
  name: трофейний стелаж
  description: Автоматичний стелаж для збрегінання трофеїв.
  components:
    - type: VehicleSmashable
    - type: Transform
      anchored: false
    - type: Physics
      bodyType: Static
    - type: MeleeSound
      soundGroups:
       Brute:
        path:
          "/Audio/Weapons/dodgeball.ogg"
    - type: InteractionOutline
    - type: PlaceableSurface
    - type: Sprite
      sprite: _Mriya/Hunter/Structures/Props/pred_trophy_vend.rsi
      state: pred_trophy_vendor_bottom_left

