- type: entity
  parent: CryogenicSleepUnit
  id: RMCHunterHypersleep
  name: гіперсон
  description: Капсула для тривалого космічного сну, створена спеціально для мисливців.
  suffix: Mriya, Hunter
  components:
  - type: Sprite
    noRot: false
    sprite: _Mriya/Hunter/Structures/Machines/hypersleep.rsi
    layers:
    - state: open
      map: ["base"]
  - type: GenericVisualizer
    visuals:
      enum.CryostorageVisuals.Full:
        base:
          True: { state: closed }
          False: { state: open }

- type: entity
  parent: RMCHunterHypersleep
  id: RMCHunterHypersleepSpawner
  suffix: Spawner, Roundstart AllJobs
  components:
  - type: ContainerSpawnPoint
    containerId: storage

- type: entity
  parent: RMCHunterHypersleep
  id: RMCHunterHypersleepSpawnerLateJoin
  suffix: Spawner, LateJoin
  components:
  - type: ContainerSpawnPoint
    containerId: storage
