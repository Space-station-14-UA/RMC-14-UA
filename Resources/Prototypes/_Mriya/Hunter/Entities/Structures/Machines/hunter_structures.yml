- type: entity
  parent: SMESAdvanced
  id: HunterSMES
  name: СМЕС
  description: Високотехнологічний накопичувач енергії для масивних кораблів
  suffix: Infinite
  components:
  - type: Sprite
    sprite: _Mriya/Hunter/Structures/smes.rsi
    layers:
    - state: smes
    - map: [ "enum.SmesVisualLayers.Charge" ]
      sprite: Structures/Power/smes.rsi
      state: "smes-og1"
      shader: unshaded
      visible: false
    - map: [ "enum.SmesVisualLayers.Input" ]
      sprite: Structures/Power/smes.rsi
      state: "smes-oc0"
      shader: unshaded
    - map: [ "enum.SmesVisualLayers.Output" ]
      sprite: Structures/Power/smes.rsi
      state: "smes-op1"
      shader: unshaded
  - type: GenericVisualizer
    visuals: {}
  - type: Icon
    sprite: _Mriya/Hunter/Structures/smes.rsi
    state: smes
  - type: Battery
    maxCharge: 1000000000
    startingCharge: 1000000000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 1000000000
  - type: PowerNetworkBattery
    maxSupply: 1000000000
    maxCharge: 0

