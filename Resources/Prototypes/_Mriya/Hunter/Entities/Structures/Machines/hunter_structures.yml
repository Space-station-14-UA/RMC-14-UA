- type: entity
  parent: SpaceHeaterEnabled
  id: MRHunterFreezer
  name: охолоджувач
  description: Пасивний охолоджувач, що генерує холод у зоні навколо.
  components:
  - type: Sprite
    sprite: _Mriya/Hunter/Structures/Machines/freezer.rsi
    layers:
    - state: freezer
  - type: Icon
    sprite: _Mriya/Hunter/Structures/Machines/freezer.rsi
    state: freezer
  - type: GenericVisualizer
    _deleted: true
  - type: WiresVisuals
    _deleted: true
