- type: entity
  parent: RMCTankReagentEmpty
  id: RMCHunterTankReagentFuel
  name: ent-hunter-tankfuel-name
  description: ent-hunter-tankfuel-desc
  suffix: Fuel
  components:
  - type: Sprite
    sprite: _Mriya/Hunter/Structures/Storage/hunter_tank.rsi
    layers:
    - state: fuel_tank
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 0
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1000
  - type: Explosive
    explosionType: Default
    totalIntensity: 60
  - type: ReagentTank
    tankType: Fuel
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 100
  - type: Label
    currentLabel: reagent-name-welding-fuel
  - type: Tag
    tags:
    - RMCTankFuel
    - RMCTankReagent

- type: entity
  parent: RMCTankReagentEmpty
  id: RMCHunterTankReagentWater
  name: ent-hunter-tankwatter
  description: ent-hunter-tankwatter-desc
  suffix: Water
  components:
  - type: Sprite
    sprite: _Mriya/Hunter/Structures/Storage/hunter_tank.rsi
    layers:
    - state: water_tank
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 0
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: Water
          Quantity: 1000
  - type: ReagentTank
