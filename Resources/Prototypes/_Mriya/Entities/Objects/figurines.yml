- type: entity
  parent: RMCBaseFigurinePatron
  categories: [ HideSpawnMenu ]
  id: MRFigurineBase
  name: базова фігурка
  description: Фігурка персонажа.
  components:
  - type: Sprite
    sprite: _Mriya/Objects/figurines.rsi
    state: base
  - type: TriggerOnActivate
  - type: TriggerOnSignal
        
- type: entity
  parent: MarkerBase
  id: MRFigurineSpawner
  name: спавнер фігурок Мрії
  components:
  - type: Sprite
    state: red
  - type: RandomSpawner
    prototypes:
    - MRFigurineKholod
    - MRFigurineNiavka
    - MRFigurineAnta
    - MRFigurineNich
    - MRFigurineShepit
    - MRFigurineShield
    - MRFigurineAssi
    - MRFigurineSyrena
    - MRFigurineOmikron
    - MRFigurineArchangel
    - MRFigurineAltra
    - MRFigurineSonechko
    - MRFigurineNesomi

- type: entity
  parent: MRFigurineBase
  id: MRFigurineKholod
  name: Рей 'Холод' Моріс
  description: Унікальна фігурка офіцера ''Холод'' з лімітованої серії командування сил КМПОН. Це рідкісна тестова модель, виготовлена з фенолформальдегідної смоли - токсичного матеріалу, через що подальші її партії були відкликані в зв'язку з численними скаргами на здоров'я робітників. Вам здається, що вона несправна.
  components:
  - type: Sprite
    state: kholod
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesKholod
  - type: EmitSoundOnActivate
    sound:
     collection: sparks
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineNiavka
  name: Куроме 'Нявка' Нявковська
  description: Соколята, пам'ятайте три золотих правила. Перше – міномету не існує. Друге – гранат не існує. Третє – не будь сліпим кошеням, за мною!
  components:
  - type: Sprite
    state: niavka
  - type: UseDelay
    delay: 60
  - type: Speech
    speechSounds: Cat
  - type: SpeakOnTrigger
    pack: MRFigurinesNiavka
  - type: EmitSoundOnActivate
    sound:
     collection: mriyaMortarTravelExplosion
    handle: false 

- type: entity
  parent: MRFigurineBase
  id: MRFigurineAnta
  name: Олексій 'Анта' Воробець
  description: Мама тоже думала що Олексій виросте хорошим хлопчиком. Але Олексій виріс з пляшкою в руці.
  components:
  - type: Sprite
    state: anta
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesAnta
  - type: EmitSoundOnActivate
    sound:
     collection: bottleOpenSounds
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineNich
  name: Еікіі 'Ніч'
  description: Не існує вправних морпіхів. Не існує природжених воїнів. Існують лиш справді фартові довбні.
  components:
  - type: Sprite
    state: nich
  - type: Speech
    speechSounds: MaleAvali
  - type: SpeakOnTrigger
    pack: MRFigurinesNich
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_Mriya/Figurines/m5_shoot_explosion3.ogg
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineShepit
  name: Ланс 'Шепіт' Морган
  description: Не підпускайте цю фігурку до вендорів з додатковими набоями, ходять слухи що вони вмить зникають.
  components:
  - type: Sprite
    state: shepit
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesShepit
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_reload.ogg
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineShield
  name: Василь 'Щит' Васильович
  description: Мені здається, він був на тій роботі… а може, на іншій? Ох-. . Схоже він клонів своїх уже на всі боки розкидав!
  components:
  - type: Sprite
    state: shield
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesShield

- type: entity
  parent: MRFigurineBase
  id: MRFigurineAssi
  name: Грейсон 'Ассі' Карлайн
  description: Якщо у вашому загоні нема ЛЗ, несіть цю фігурку на БІЦ у вас появиться новий ЛЗ.
  components:
  - type: Sprite
    state: assi
  - type: SpeakOnTrigger
    pack: MRFigurinesAssi
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Effects/tech_notification.ogg
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineSyrena
  name: Джек 'Сирена' Картер
  description: Доволі веселий погляд, в якому відчувається легкість та, водночас, суворість.
  components:
  - type: Sprite
    state: syrena
  - type: UseDelay
    delay: 300
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesSyrena
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/gun_orbital_travel.ogg 
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineOmikron
  name: Датар-Ушар 
  description: Унатх зростом приблизно 200~210см, середньої тілобудови, пазурі тупі, відсутній безіменний палець лівої руки, роги сильно пошкоджені. На його шиї помітно невеликий кулон, бронзовий хвіст ящірки що перетинається списом.
  components:
  - type: Sprite
    state: omikron
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/Guns/Pump/gun_boomslang_lever.ogg

- type: entity
  parent: MRFigurineBase
  id: MRFigurineArchangel
  name: Каар 'Архангел'
  description: Авалі з чорно-червоним пір'ям тримаючи гвинтівку в руках дивится в бік, його ноги та пояс вкриті зеленою-. . кислотою?
  components:
  - type: Sprite
    state: archangel
  - type: Speech
    speechSounds: MaleAvali
  - type: SpeakOnTrigger
    pack: MRFigurinesArchangel
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/Guns/Cock/gun_cocked2.ogg
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineAltra
  name:  Альтаїра 'Альтра' Мунраннер
  description: "Хтось каже, що фенікс завжди постає з попелу, але ж це не фенікс. Помаранчевопуха ніана, наче молода, але щодо цього твердження вже є сумніви... Якщо вона вам не подобається - це взаємно.\nНа основі фігурки помітний маленький підпис: \"Другий Капітан-ОП українського КМПОН\""
  components:
  - type: Sprite
    state: altra
  - type: Speech
    speechSounds: Moth
  - type: SpeakOnTrigger
    pack: MRFigurinesAltra
  - type: EmitSoundOnActivate
    sound:
     collection: sparks
    handle: false
  - type: Extractable
    grindableSolutionName: ash
  - type: SolutionContainerManager
    solutions:
      ash:
        maxVol: 15
        reagents:
        - ReagentId: Ash
          Quantity: 15

- type: entity
  parent: MRFigurineBase
  id: MRFigurineSonechko
  name:  Річард 'Сонечко' Мартіноз
  description: Чемпіон, кращий медик епохи, той, хто переміг королеву самотужки, а також просто Сонечко.
  components:
  - type: Sprite
    state: sonechko
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesSonechko
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Effects/laser_cannon.ogg
    handle: false

- type: entity
  parent: MRFigurineBase
  id: MRFigurineNesomi
  name: Несомі
  description: Велика (як для авалі) та фіолетова істота. Чомусь ви почуваєтеся дуже комфортно поряд з ним... Якщо гарно придивитися, то можна помітити різнокольорові пір'їни у гребені.
  components:
  - type: Sprite
    state: nesomi
  - type: Speech
    speechSounds: MaleAvali
  - type: SpeakOnTrigger
    pack: MRFigurinesNesomi
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Effects/Cloak/cloak_scout_on.ogg
    handle: false
