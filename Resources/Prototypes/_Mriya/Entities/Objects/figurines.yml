- type: entity
  parent: RMCBaseFigurinePatron
  categories: [ HideSpawnMenu ]
  id: MRFigurineBase
  name: базова фігурка
  description: Фігурка персонажа.
  components:
  - type: Sprite
    sprite: _Mriya/Objects/figurines.rsi
    state: base
  - type: TriggerOnActivate
  - type: TriggerOnSignal

- type: entity
  parent: MarkerBase
  id: MRFigurineSpawner
  name: спавнер фігурок Мрії
  components:
  - type: Sprite
    state: red
  - type: RandomSpawner
    prototypes:
    - MRFigurineKholod
    - MRFigurineNyavka
    - MRFigurineAnta
    - MRFigurineNich
    - MRFigurineShepit
    - MRFigurineShield
    - MRFigurineAssi
    - MRFigurineSyrena
    - MRFigurineOmikron
    - MRFigurineArchangel
    - MRFigurineAltra
    - MRFigurineSonechko
    - MRFigurineNesomi
    - MRFigurineLynette

# Персонаж Рокта (ДС: roct)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineKholod
  name: Рей 'Холод' Моріс
  description: Унікальна фігурка офіцера ''Холод'' з лімітованої серії командування сил КМПОН. Це рідкісна тестова модель, виготовлена з фенолформальдегідної смоли - токсичного матеріалу, через що подальші її партії були відкликані в зв'язку з численними скаргами на здоров'я робітників. Вам здається, що вона несправна.
  components:
  - type: Sprite
    state: kholod
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesKholod
  - type: EmitSoundOnActivate
    sound:
     collection: sparks
    handle: false

# Персонаж Потатоїда (ДС: potatoed)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineNyavka
  name: Куроме 'Нявка' Нявковська
  description: Соколята, пам'ятайте три золотих правила. Перше – міномету не існує. Друге – гранат не існує. Третє – не будь сліпим кошеням, за мною!
  components:
  - type: Sprite
    state: nyavka
  - type: UseDelay
    delay: 30
  - type: Speech
    speechSounds: Cat
  - type: SpeakOnTrigger
    pack: MRFigurinesNyavka
  - type: EmitSoundOnActivate
    sound:
     collection: MRMortarTravelExplosion
     params:
       volume: -6
       maxDistance: 6.0
    handle: false

# Персонаж Дмитра (ДС: dmltr0)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineAnta
  name: Олексій 'Анта' Воробець
  description: Мама теж думала, що Олексій виросте хорошим хлопчиком. Але Олексій виріс із пляшкою в руці.
  components:
  - type: Sprite
    state: anta
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesAnta
  - type: EmitSoundOnActivate
    sound:
     collection: bottleOpenSounds
    handle: false

# Персонаж Франца (ДС: kit_timoxa)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineNich
  name: Еікіі 'Ніч'
  description: Не існує вправних морпіхів. Не існує природжених воїнів. Існують лише справді фартові довбні.
  components:
  - type: Sprite
    state: nich
  - type: UseDelay
    delay: 10
  - type: Speech
    speechSounds: MaleAvali
  - type: SpeakOnTrigger
    pack: MRFigurinesNich
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_Mriya/Figurines/m5_shoot_explosion3.ogg
    handle: false

# Персонаж Хорвата, автора фігурок (ДС: horvatbg)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineShepit
  name: Ланс 'Шепіт' Морган
  description: Не підпускайте цю фігурку до вендорів з додатковими набоями - ходять чутки, що вони вмить зникають.
  components:
  - type: Sprite
    state: shepit
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesShepit
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_reload.ogg
     params:
       volume: -6
       maxDistance: 6.0
    handle: false

# Персонаж Аксіора (ДС: axiore389)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineShield
  name: Василь 'Щит' Васильович
  description: Мені здається, він був на тій роботі… а може, на іншій? Ох-. . Схоже він клонів своїх уже на всі боки розкидав!
  components:
  - type: Sprite
    state: shield
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesShield

# Персонаж Ітамерава (ДС: itameraw)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineAssi
  name: Грейсон 'Ассі' Карлайн
  description: Якщо у вашому загоні нема ЛЗ - несіть цю фігурку на БІЦ та у вас з'явиться новий ЛЗ.
  components:
  - type: Sprite
    state: assi
  - type: UseDelay
    delay: 60
  - type: SpeakOnTrigger
    pack: MRFigurinesAssi
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Effects/tech_notification.ogg
     params:
       volume: -6
       maxDistance: 6.0
    handle: false

# Персонаж Перкартера (ДС: perkarter)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineSyrena
  name: Джек 'Сирена' Картер
  description: Доволі веселий погляд, в якому відчувається легкість та, водночас, суворість.
  components:
  - type: Sprite
    state: syrena
  - type: UseDelay
    delay: 180
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesSyrena
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/gun_orbital_travel.ogg
     params:
       volume: -6
       maxDistance: 6.0
    handle: false

# Персонаж ХХХБ (ДС: ?)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineOmikron
  name: "'Омікрон'"
  description: Унатх зростом приблизно 20~21см, середньої тілобудови, пазурі тупі, відсутній безіменний палець лівої руки, роги сильно пошкоджені. На його шиї помітно невеликий кулон на якому зображено бронзовий хвіст ящірки, що перетинається списом.
  components:
  - type: Sprite
    state: omikron
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/Guns/Pump/gun_boomslang_lever.ogg

# Персонаж Гамункула (ДС: fearone22)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineArchangel
  name: Каар 'Архангел'
  description: Авалі з чорно-червоним пір'ям тримаючи гвинтівку в руках, дивиться вбік. Його ноги та пояс вкриті зеленою-. . кислотою?
  components:
  - type: Sprite
    state: archangel
  - type: Speech
    speechSounds: MaleAvali
  - type: SpeakOnTrigger
    pack: MRFigurinesArchangel
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Weapons/Guns/Cock/gun_cocked2.ogg
    handle: false

# Персонаж Пігріхи (ДС: pgriha)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineAltra
  name: Альтаїра 'Альтра' Мунраннер
  description: "Хтось каже, що фенікс завжди постає з попелу, але ж це не фенікс. Помаранчевопуха ніана, наче молода, але щодо цього твердження вже є сумніви... Якщо вона вам не подобається - це взаємно.\nНа основі фігурки помітний маленький підпис: \"Другий Капітан-ОП українського КМПОН\""
  components:
  - type: Sprite
    state: altra
  - type: Speech
    speechSounds: Moth
  - type: SpeakOnTrigger
    pack: MRFigurinesAltra
  - type: EmitSoundOnActivate
    sound:
     collection: sparks
    handle: false
  - type: Extractable
    grindableSolutionName: ash
  - type: SolutionContainerManager
    solutions:
      ash:
        maxVol: 15
        reagents:
        - ReagentId: Ash
          Quantity: 15

# Персонаж Петробу (ДС: ?)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineSonechko
  name: Річард 'Сонечко' Мартіноз
  description: Чемпіон, кращий медик епохи, той, хто переміг королеву самотужки, а також просто Сонечко.
  components:
  - type: Sprite
    state: sonechko
  - type: UseDelay
    delay: 10
  - type: Speech
    speechSounds: Alto
  - type: SpeakOnTrigger
    pack: MRFigurinesSonechko
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Effects/laser_cannon.ogg
     params:
       volume: -6
       maxDistance: 6.0
    handle: false

# Персонаж Романа (ДС: pomahtop)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineNesomi
  name: Несомі
  description: Велика (як для авалі) та фіолетова істота. Чомусь ви почуваєтеся дуже комфортно поруч з ним... Якщо гарно придивитися, то можна помітити різнокольорові пір'їни у гребені.
  components:
  - type: Sprite
    state: nesomi
  - type: Speech
    speechSounds: MaleAvali
  - type: SpeakOnTrigger
    pack: MRFigurinesNesomi
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/_RMC14/Effects/Cloak/cloak_scout_on.ogg
    handle: false

# Персонаж Міюгі (ДС: _miyugi_)
- type: entity
  parent: MRFigurineBase
  id: MRFigurineLynette
  name: Ліннет
  description: Ця фігурка нагадує вам ту неясну фігуру, яку ви інколи помічаєте краєм ока на Саванні, поки вона не зникне на другому поверсі, супроводжуючи іншу ніану. Чи ту, що самотньо блукає колоніями, наче шукаючи когось.
  components:
  - type: Sprite
    state: lynette
  - type: Speech
    speechSounds: Moth
  - type: SpeakOnTrigger
    pack: MRFigurinesLynette
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/Effects/pill_insert.ogg
    handle: false
