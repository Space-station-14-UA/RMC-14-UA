# Ліниво взято з СМУ (https://github.com/AU-14/ColonialMarinesUniverse/blob/master/Content.CMU/Resources/Prototypes/CMU14/Entities/Objects/Items/Medical/audefib.yml)
# Працює без тримачок та голосу, в ідеалі їх перенести колись там також
- type: entity
  parent: CMDefibrillator
  id: MRDefibrillatorCivilian
  suffix: Мрія. Не потребує навички
  name: цивільний дефібрилятор
  description: Величезна версія дефібрилятора, яка призначена для використання особами без спеціалізованої підготовки. Його основна задача – це нормалізувати серцевий ритм пацієнта. За допомогою цього можна повертати людей з мертвих! Має заряду лише на одну реанімацію та не може бути перезаряджений.
  components:
  - type: Sprite
    sprite: _CMU14/Items/audefib.rsi
    layers:
    - state: defib
    - state: defib_on
      map: [ "enum.ToggleableVisuals.Layer" ]
      visible: false
    # The paddles sit docked on top and only come off while it's charged for a shock.
    #- state: defibpaddlesoverlay – ТОДО. Перенести систему з СМУ
    #  map: [ "paddles" ]
  - type: MultiHandedItem
  - type: Item
    size: Huge
    sprite: _CMU14/Items/audefib.rsi
    heldPrefix: defib
  - type: Clothing
    sprite: _CMU14/Items/audefib.rsi
    slots:
    - OUTERCLOTHING
    - back
    quickEquip: false
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      #enum.CMUDefibVisuals.PaddlesOut: – ТОДО. Перенести систему з СМУ
      #  paddles:
      #    True: { visible: false }
      #    False: { visible: true }
  - type: Defibrillator # х4 відносно звичайного, щоб було менше шансів випадково всрати цей один заряд
    rmcZapHeal:
    - Brute: -48
    - Burn: -48
    - Toxin: -48
    - Genetic: -48
  - type: PowerCellDraw
    enabled: false
    useRate: 1000 # Вся батарейка за раз
  - type: RequiresSkill # Скіл не треба
    skills: {}
  - type: Tag
    tags:
    - MRDefibrillatorCivilian # Щоб не могли зарядити
