# Ролі/Підролі
- type: entity
  parent: CMPamphlet
  id: MRPamphletSherpa
  name: довідник шерпи
  description: Тут описується, як правильно переносити важкі речі. Такі важкі матерії зможе обробити лише мозок справжнього стрільця.
  suffix: Мрія. Лише для Стрільців
  components:
    - type: Sprite
      sprite: _Mriya/Objects/Misc/pamphlets.rsi
      state: pamphlet_sherpa
    - type: SkillPamphlet
      addComps:
        - type: MRSherpaRifleman
      addSkills:
        RMCSkillFireman: 2
      giveJobTitle: mriya-rmc-job-name-sherpa
      givePrefix: mriya-rmc-job-prefix-sherpa
      isAppendPrefix: false
      giveIcon:
        sprite: _Mriya/Interface/cm_job_icons.rsi
        state: hudsquad_sherpa
      giveMapBlip:
        sprite: /Textures/_Mriya/Interface/map_blips.rsi
        state: sherpa
      bypassLimit: false # Mriya. Особливі ролі лише один раз
      jobWhitelists:
        - popup: rmc-pamphlets-rifleman-warning
          jobProto: CMRifleman

# Навички
## Я тільки зараз зрозумів, як воно схоже на шерпу, тому це фактично буде те саме, але на мінімалках. . .
- type: entity
  parent: CMPamphlet
  id: MRPamphletFireman
  name: довідник перенесення на плечах
  description: Тут описується, як правильно переносити людей на собі.
  suffix: Мрія
  components:
    - type: Sprite
      sprite: _Mriya/Objects/Misc/pamphlets.rsi
      state: pamphlet_sherpa
    - type: SkillPamphlet
      addSkills:
        RMCSkillFireman: 2

- type: entity
  parent: CMPamphlet
  id: MRPamphletMedical
  name: медичний довідник для сержантів
  description: Тут описується те, як не витратити кілька років свого життя навчаючися на медичному. Настільки розумне, що це зможуть зрозуміти лише Лідери Загонів.
  suffix: Мрія. Лише для ЛЗ
  components:
    - type: Sprite
      state: pamphlet_medical
    - type: SkillPamphlet
      addSkills:
        RMCSkillMedical: 2
      skillCap:
        RMCSkillMedical: 2
      jobWhitelists:
        - popup: mriya-pamphlets-squad-leader-warning
          jobProto: CMSquadLeader

# Мови
- type: entity
  parent: CMPamphletLanguage
  id: MRPamphletLanguageEnglish
  name: шматок підручника з англійської мови за 7 клас
  description: Ну хоча б у 22 столітті ця штука буде мати ж сенс, так? Правильно! Тобі вистачить цього, щоб почати розуміти англійську на базовому рівні.
  components:
  - type: SkillPamphlet
    language: MREnglish
