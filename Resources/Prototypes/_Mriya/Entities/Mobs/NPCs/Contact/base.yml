# Marines in sight
- type: utilityQuery
  id: MRContactNearbyMarines
  query:
  - !type:ComponentQuery
    components:
    - type: Marine
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve
 
# Branch order = priority (HTN preempts lower branches when a higher one becomes valid):
# 1. Hold position (ranged castes, wind-up abilities)
# 2. Smash what's blocking the way
# 3. Fight what you see
# 4. Investigate gunshots
# 5. Drift toward the nearest marine
# 6. Idle

- type: htnCompound
  id: MRContactMeleeMarineCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: MRContactNearbyMarines
        key: Target


- type: htnCompound
  id: MRContactXenoCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: MRContactHold
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: MRContactHold
  - preconditions:
    - !type:KeyExistsPrecondition
      key: MRContactSmashActive
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        removeKeyOnFinish: false
        targetKey: MRContactSmashCoordinates
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:ContactSmashOperator
        targetKey: MRContactSmashTarget
  - preconditions:
    - !type:KeyExistsPrecondition
      key: MRContactDefenseActive
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        removeKeyOnFinish: false
        targetKey: MRContactDefenseCoordinates
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:ContactSmashOperator
        targetKey: MRContactDefenseTarget
  - preconditions:
    - !type:KeyExistsPrecondition
      key: MRContactMeleeActive
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: MRContactNearbyMarines
    - !type:HTNCompoundTask
      task: MRContactMeleeMarineCompound
  - preconditions:
    - !type:KeyExistsPrecondition
      key: MRContactHuntActive
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        removeKeyOnFinish: false
        targetKey: MRContactHunt
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: entity
  abstract: true
  id: MRContactXenoAIBase
  components:
  - type: MobMover
  - type: RemoveComponents
    components:
    - type: ActiveInputMover
    - type: SSDIndicator
  - type: HTN
    rootTask:
      task: MRContactXenoCompound
    blackboard:
      NavSmash: !type:Bool true # attack obstacles the pathfinder knows about
      NavPry: !type:Bool true # pry doors
      NavClimb: !type:Bool true
      VisionRadius: !type:Single 12
      AggroVisionRadius: !type:Single 14
  - type: ContactXenoAI
    smashTimeout: 1
    noPryTime: 5
    smashWhitelist:
      components:
      - Barricade
      - XenoCrusherChargable
      - XenoToggleChargingDamage
  - type: XenoHidden