    announcement: "Вестон-Ямада втратили зв'язок з одним зі своїх біосховищ, колонією Хребет Солярис на планеті ЖЗ-1413 (Рутерра-І). Початково вона використовувалась для експериментів з тераформуванням лишайником, але після їх провалу – продана корпорації Вестон-Ямада. На колонії підтверждено зараження ХХ-121."