  components:
  - type: RMCPlanetMapPrototype
    map: /Maps/_Mriya/Planets/contact_chances_ablock.yml
    camouflage: Classic
    inRotation: false
    specialFaxes:
      Liaison: RMCPaperWeYaLiaisonBriefingChances
    announcement: "Пан-Пан. Це командуючий офіцер КОН \"Ганют\", ФОРКОН КМПОН. Ми висадилися на планеті ЖЗ-522 неподалік \"Землі Фортуни\", повторюю, неподалік \"Землі Фортуни\". ХХ-121 підтверждено у ЗО, нам потрібна допомога у їхньому стриманні ВІД УСІХ КОРАБЛІВ ПОБЛИЗУ; це повідомлення транслюватиметься кожні 24 години."

- type: entity
  id: MRPlanetFiorinaContact
  name: Науковий Комплекс Фіоріна (Південь)
  components:
  - type: RMCPlanetMapPrototype
    map: /Maps/_Mriya/Planets/contact_prison_south.yml
    camouflage: Classic
    inRotation: false
    specialFaxes:
      Liaison: RMCPaperWeYaLiaisonBriefingFiorina
    announcement: "Сигнал лиха було отримано з в'язниці суворого режиму \"Орбітальна Тюрма Фіоріна\". Початково станція існувала на орбіті планети Фіоріна-161 заради розвідки покладів платини цієї ж планети, але після їх вичерпання була перебудована у Орбітальну тюрму та Науковий комплекс, ціллю дослідження якого стало ████████. На станції підтверждено інфестацію ХХ-121, найближчим часом з ДКП-Саванна \"Січ\" буде відправлена група реагування."

