    - FullAuto
    recoilUnwielded: 2
    scatterWielded: 6
    baseFireRate: 2.86
    burstFireRateMultiplier: 2
    modifiers:
      Burst:
        fireDelay: 0.1
        maxScatterModifier: 2
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 1
