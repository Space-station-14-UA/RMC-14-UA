- type: entity
  id: MRContactReinforcementTerminal
  parent: BaseStructure
  name: термінал підкріплень
  description: Викликає шатл з підкріпленнями, коли він заправлений і на борту є люди.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    layers:
    - state: retro2b
      map: [ "enum.ContactReinforcementTerminalVisuals.State" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ContactReinforcementTerminalVisuals.State:
        enum.ContactReinforcementTerminalVisuals.State:
          Blocked: { state: retro2b }
          Active: { state: retro2 }
          Evacuation: { state: retro0 }
    state: retro2b
  - type: Clickable
  - type: InteractionOutline
  - type: ContactReinforcementTerminal
  - type: MarineMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: supply