# Звичайний
- type: entity
  parent: [ BaseMachinePowered, RMCConstructibleMachine ]
  id: MRTerminalInput
  name: термінал комунікації
  description: Термінал для прямого каналу зв'язку з Ве-Я. Має слот для ID-картки.
  suffix: Мрія, Ввід
  components:
  - type: Transform
    anchored: false
    noRot: false
  - type: Sprite
    sprite: _Mriya/Structures/Machines/console.rsi
    state: console
  - type: MriyaTerminal
    isInput: true
  - type: Clickable
  - type: Rotatable
  - type: ActivatableUI
    key: enum.Content.Shared._Mriya.Terminal.MriyaTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.Content.Shared._Mriya.Terminal.MriyaTerminalUiKey.Key:
        type: MriyaTerminalBoundUserInterface
  - type: ItemSlots
    slots:
      id_card:
        name: ID-картка
        whitelist:
          components:
          - IdCard
          - Pda
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MRTerminalBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RemoveComponents
    components:
    - type: ApcPowerReceiver
    - type: Anchorable

- type: entity
  parent: MRTerminalInput
  id: MRTerminalInputCorporate
  description: Корпоративний термінал для прямого каналу зв'язку з Ве-Я. Має слот для ID-картки.
  suffix: Мрія, Ввід (Корпорат)
  components:
  - type: MriyaTerminal
    isInput: true
    requiredAccesses:
    - RMCAccessWeYa

- type: entity
  parent: MRTerminalInput
  id: MRTerminalInputCommand
  description: Офіцерський термінал для прямого каналу зв'язку з Ве-Я. Має слот для ID-картки.
  suffix: Мрія, Ввід (Командування)
  components:
  - type: MriyaTerminal
    isInput: true
    requiredAccesses:
    - RMCAccessCommand

- type: entity
  parent: MRTerminalInput
  id: MRTerminalOutput
  description: Корпоративний термінал для прямого каналу зв'язку з Ве-Я.
  suffix: Мрія, Перегляд
  components:
  - type: MriyaTerminal
    isInput: false
  - type: RemoveComponents
    components:
    - type: ItemSlots
    - type: ApcPowerReceiver
    - type: Anchorable

- type: entity
  parent: ComputerBroken
  id: MRTerminalBroken
  name: зламаний термінал комунікації
  description: Це корпоративний термінал комунікації з Ве-Я... Принаймні був.
  components:
  - type: Sprite
    sprite: _Mriya/Structures/Machines/console.rsi
    state: broken

# Настінний
- type: entity
  parent: MRTerminalInput
  id: MRWallmountTerminalInput
  name: настінний термінал комунікації
  description: Термінал для прямого каналу зв'язку з Ве-Я з вашої стіни! Має слот для ID-картки.
  suffix: Мрія, Ввід
  components:
  - type: Sprite
    sprite: _Mriya/Structures/Machines/console.rsi
    state: wall
  - type: WallMount
    arc: 360
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MRWallmountTerminalBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: [ MRWallmountTerminalInput, MRTerminalInputCorporate ]
  id: MRWallmountTerminalInputCorporate
  suffix: Мрія, Ввід (Корпорат)

- type: entity
  parent: [ MRWallmountTerminalInput, MRTerminalInputCommand ]
  id: MRWallmountTerminalInputCommand
  suffix: Мрія, Ввід (Командування)

- type: entity
  parent: MRWallmountTerminalInput
  id: MRWallmountTerminalOutput
  description: Корпоративний термінал для прямого каналу зв'язку з представниками та КМПОН.
  suffix: Мрія, Перегляд
  components:
  - type: MriyaTerminal
    isInput: false
  - type: RemoveComponents
    components:
    - type: ItemSlots
    - type: ApcPowerReceiver
    - type: Anchorable

- type: entity
  parent: ComputerBroken
  id: MRWallmountTerminalBroken
  name: зламаний настінний термінал комунікації
  description: Це корпоративний термінал комунікації з Ве-Я... Принаймні був.
  components:
  - type: Sprite
    sprite: _Mriya/Structures/Machines/console.rsi
    state: broken_wall
  - type: WallMount
    arc: 360
