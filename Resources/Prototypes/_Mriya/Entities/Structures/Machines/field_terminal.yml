- type: entity
  id: MRContactTerminal
  name: якір
  description: Термінал стабілізації поля. Активуйте, щоб продовжити існування поля.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _Mriya/Structures/anchor.rsi
    layers:
    - state: tower_off
      map: [ "base" ]
    state: tower_off
    offset: 0,2
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SensorTowerLayers.Layer:
        base:
          Off: { state: tower_off }
          On: { state: tower_on }
  - type: ContactTerminal
  - type: MarineMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: aegisob
  - type: AmbientSound
    enabled: false
    range: 8
    volume: -4
    sound:
      path: /Audio/Ambience/Objects/gravity_gen_hum.ogg