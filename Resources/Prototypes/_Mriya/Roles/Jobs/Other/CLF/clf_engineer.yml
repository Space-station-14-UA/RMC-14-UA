- type: job
  parent: RMCCLFEngineer
  id: MRCLFEngineer
  startingGear: MRGearCLFEngineer
  spawnMenuRoleName: ФВК Інженер
  accessGroups:
  - Colony
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 1
        RMCSkillMeleeWeapons: 1
        RMCSkillPolice: 1
        RMCSkillEndurance: 1
        RMCSkillJtac: 1
        RMCSkillVehicles: 1
        RMCSkillMedical: 1

        RMCSkillConstruction: 3
        RMCSkillEngineer: 3
        RMCSkillPowerLoader: 2
    - type: NpcFactionMember
      factions:
      - CLF
    - type: JobPrefix
      prefix: rmc-job-prefix-clf-engineer
  hidden: true

- type: entity
  id: MRRandomHumanoidCLFEngineer
  name: ФВК спавнер ролі привидів Інженера
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Armbands/clf_armband.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: MRCLFEngineer

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: MRCLFEngineer
  components:
  - type: GhostRole
    name: rmc-ghost-role-clf-engineer
    description: rmc-ghost-role-information-clf-description
    rules: rmc-ghost-role-information-clf-rules
    reregister: false
    job: MRCLFEngineer
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: CMJobCombatTech
      time: 18000 # 5 Hours
  - type: GhostRoleApplySpecial
    squad: SquadCLF

- type: startingGear
  id: MRGearCLFEngineer
  equipment:
    head: RMCHelmetWelding
    mask: RMCCombatUtilityKnifeA
    ears: RMCHeadsetDistressCLF
    eyes: ClothingEyesGlassesMeson # ТОДО. Замінити на РМСні
    jumpsuit: RMCJumpsuitCLFWebbingMAR50
    outerClothing: MRCoatMilitiaHauberk
    gloves: CMHandsInsulated
    shoes: RMCShoesOrange
    id: MRIDCardCLFEngineer
    belt: CMBeltUtilityFilled
    back: RMCSatchelLightpackWelder
    pocket1: RMCPouchConstructionFillLowGrade
    pocket2: RMCPouchFirstAidERTFill
  inhand:
  - WeaponShotgunM357Sawn # TODO RMC14 - Make randomized
  - CMShellShotgunIncendiaryBuckshot # TODO RMC14 - Make randomized
  storage:
    jumpsuit:
    - CMShellShotgunBuckshot
    - CMShellShotgunBuckshot
    - CMShellShotgunBuckshot
    - CMShellShotgunIncendiary
    - CMShellShotgunIncendiary
    back:
    - RMCExplosiveBreachingCharge
    - RMCExplosiveBreachingCharge
    - RMCGrenadeMolotov
    - RMCGrenadeMolotov
    - RMCBinocularsCiv
    - RMCMRECLF
    - RMCFlashlight
    - RMCBoxClaymoreMineFilled
    - RMCBoxClaymoreMineFilled
    belt:
    - RMCExplosivePlastic
    - RMCExplosivePlastic
    - RMCExplosivePlastic
    outerClothing:
    - CMShellShotgunFlechette
    - CMShellShotgunFlechette
