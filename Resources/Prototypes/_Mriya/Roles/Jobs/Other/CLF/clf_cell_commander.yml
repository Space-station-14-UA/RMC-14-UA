# Всеодно поки використовуватися не буде. Не завершено.
- type: job
  parent: RMCCLFCellCommander
  id: MRCLFCellCommander
  startingGear: MRGearCLFCellCommander
  spawnMenuRoleName: ФВК Командир Ячейки
  accessGroups:
  - Colony # Доступ до всієї колонії. Вони там достатньо довго, щоб накрасти доступи
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 3
        RMCSkillMeleeWeapons: 1
        RMCSkillPolice: 1 # RMC14 disallow use of flashbangs
        RMCSkillEndurance: 5
        RMCSkillJtac: 4
        RMCSkillVehicles: 1

        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillPowerLoader: 2
        RMCSkillMedical: 2
        RMCSkillSurgery: 1

        RMCSkillOverwatch: 1
        RMCSkillLeadership: 3
        RMCSkillCqc: 2

        RMCSkillSmartGun: 1
        RMCSkillExecution: 1
    - type: NpcFactionMember
      factions:
      - CLF
    - type: JobPrefix
      prefix: rmc-job-prefix-clf-cell-commander
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/job_icons/CLF.rsi
        state: clf_cellcom
    - type: RMCPointing
    - type: MarineOrders
  hidden: true

- type: entity
  id: MRRandomHumanoidCLFCellCommander
  name: ФВК спавнер ролі привидів Командира Ячейки
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Armbands/clf_armband.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: MRCLFCellCommander

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: MRCLFCellCommander
  components:
  - type: GhostRole
    name: rmc-ghost-role-clf-cell-commander
    description: rmc-ghost-role-information-clf-description
    rules: rmc-ghost-role-information-clf-rules
    reregister: false
    job: MRCLFCellCommander
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: CMJobSquadLeader
      time: 36000 # 10 Hours
  - type: GhostRoleApplySpecial
    squad: SquadCLF

- type: startingGear
  id: MRGearCLFCellCommander
  equipment:
    head: RMCArmorHelmetMercenaryMiner
    mask: RMCCombatUtilityKnifeB
    ears: RMCHeadsetDistressCLF
    jumpsuit: RMCJumpsuitCLFSoldier
    outerClothing: MRCoatMilitiaHarness
    gloves: CMHandsBlackMarine
    shoes: RMCShoesCombat
    suitstorage: RMCSmartGunCLF
    id: MRIDCardCLFCellCommander # TODO RMC14
    belt: RMCBeltSmartGunOperatorPistolCLF
    pocket1: RMCPouchSurvivalFill
    pocket2: RMCPouchFirstAidInjectors
  storage:
    outerClothing:
    - RMCSpeedLoaderMatebaHighImpact
    - RMCSpeedLoaderMatebaHighImpact
