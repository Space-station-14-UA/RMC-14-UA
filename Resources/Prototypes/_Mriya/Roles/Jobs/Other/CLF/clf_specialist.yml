- type: job
  parent: RMCCLFSpecialist
  id: MRCLFSpecialist
  startingGear: MRGearCLFSpecialist
  spawnMenuRoleName: ФВК Спеціаліст
  accessGroups:
  - Colony
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 1
        RMCSkillMeleeWeapons: 1
        RMCSkillPolice: 1
        RMCSkillEndurance: 1
        RMCSkillVehicles: 1
        RMCSkillConstruction: 1
        RMCSkillEngineer: 1

        RMCSkillJtac: 2
        RMCSkillCqc: 1
        RMCSkillLeadership: 1
    - type: DemoSpecWhitelist
    - type: GrenadeSpecWhitelist
    - type: ScoutWhitelist
    - type: SniperWhitelist
    - type: PyroWhitelist
    - type: MarineOrders
    - type: NpcFactionMember
      factions:
      - CLF
    - type: JobPrefix
      prefix: rmc-job-prefix-clf-specialist
  hidden: true

- type: entity
  id: MRRandomHumanoidCLFSpecialist
  name: ФВК спавнер ролі привидів Спеціаліста
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Armbands/clf_armband.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: MRCLFSpecialist

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: MRCLFSpecialist
  components:
  - type: GhostRole
    name: rmc-ghost-role-clf-specialist
    description: rmc-ghost-role-information-clf-description
    rules: rmc-ghost-role-information-clf-rules
    reregister: false
    job: MRCLFSpecialist
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: CMJobWeaponsSpecialist
      time: 18000 # 5 Hours
  - type: GhostRoleApplySpecial
    squad: SquadCLF

- type: startingGear
  id: MRGearCLFSpecialist
