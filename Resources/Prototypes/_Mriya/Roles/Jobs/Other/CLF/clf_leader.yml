  startingGear: MriyaGearCLFCellLeader
  spawnMenuRoleName: ФВК Лідер
  accessGroups:
  - Colony
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 3
        RMCSkillMeleeWeapons: 1
        RMCSkillPolice: 1
        RMCSkillEndurance: 5
        RMCSkillJtac: 3
        RMCSkillVehicles: 1

        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillPowerLoader: 2
        RMCSkillMedical: 2
        RMCSkillSurgery: 1

        RMCSkillOverwatch: 1
        RMCSkillLeadership: 3
        RMCSkillCqc: 2
    - type: NpcFactionMember
      factions:
      - CLF
    - type: JobPrefix
      prefix: rmc-job-prefix-clf-cell-leader
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/cm_job_icons.rsi
        state: clf_sl
    - type: RMCPointing
