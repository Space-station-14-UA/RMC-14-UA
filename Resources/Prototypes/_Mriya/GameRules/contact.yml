
- type: entity
  id: MRContactDistress
  parent: CMDistressSignal
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 0
  - type: CMDistressSignalRule
    requireXenoPlayers: false
    spawnXenos: false
    spawnSurvivors: false
    autoEnd: false
    bioscan: false
    startARESAnnouncements: true
    doJobSlotScaling: false
    lastMarineEffects: false
 
- type: entity
  id: MRContactRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: ContactEconomy
    killReward: 15
    healReward: 15
    healStep: 20
    reviveReward: 100
    terminalReward: 50
    assistFraction: 0.5
    killRewards:
      MRContactXenoDrone: 15
      MRContactXenoDefender: 20
      MRContactXenoLurker: 20
      MRContactXenoCrusher: 30
      MRContactXenoCharger: 30
      MRContactXenoRavagerBerserker: 150
      MRContactXenoBoiler: 20
  - type: ContactShuttle
    boardingCountdown: 30
    unloadTime: 15
    refuelTime: 150
  - type: ContactExtraction
    everyWaves: 10
    breakTime: 45
    zoneRadius: 10
    startCountdown: 10
    holdTime: 150
    holdWaveInterval: 20
    boardTime: 30
  - type: ContactRule
    announcementPreset: MRARES
    planets:
    - MRPlanetChancesContact
    - MRPlanetFiorinaContact
    - MRPlanetSolaris
  - type: ContactCleanup
  - type: ContactLoadout
    basePoints: 16
    milestones:
      20: 2
      40: 2

- type: contactWaves
  id: MRContactWavesDefault
  spawns:
  - proto: MRContactXenoDrone
    startWave: 1
    rate: 2
    ratePerWave: 0.15
    maxAlive: 30
  - proto: MRContactXenoDefender
    startWave: 2
    rate: 1
    ratePerWave: 0.15
    maxAlive: 5
  - proto: MRContactXenoLurker
    startWave: 5
    every: 2
    rate: 1
    ratePerWave: 0
    maxAlive: 2
  - proto: MRContactXenoCrusher
    startWave: 9
    rate: 1
    ratePerWave: 0.15
    maxAlive: 5
  - proto: MRContactXenoCharger
    startWave: 25
    every: 2
    rate: 1
    ratePerWave: 0
    maxAlive: 1
  - proto: MRContactXenoRavagerBerserker
    startWave: 20
    every: 2
    rate: 1
    ratePerWave: 0.15
    maxAlive: 4
  - proto: MRContactXenoBoiler
    startWave: 15
    rate: 1
    ratePerWave: 0.05
    maxAlive: 3
  # - proto: CMXenoQueen # boss example, spawns only at wave 20
  #   startWave: 20
  #   rate: 1
  #   ratePerWave: -1
  #   maxAlive: 1
  buffs:
  - wave: 20
    health: 1.25 # + 25% from BASE
    damage: 1.1
    # announcement: pruvit
  - wave: 40
    health: 1.5 # + 50% from BASE, not from 125%
    damage: 1.25
  - wave: 60
    health: 2
    damage: 1.5
  - wave: 80
    health: 2.5
    damage: 1.75

- type: entity
  id: MRContactPathBlocker
  categories: [ HideSpawnMenu ]
  name: path blocker
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
  - type: ContactPathBlocker


# Casino
# Rules. Slots return ~95% with these weights (2+4+6+8+12 = 32), any 2 cherries pay ×2.
- type: contactCasino
  id: MRContactCasinoDefault
  slotBets: [ 5, 10, 25, 50 ]
  symbols:
  - name: mriya-contact-casino-symbol-seven
    entity: RMCFireAxe
    color: "#FF4D4D"
    weight: 2
    three: 50
  - name: mriya-contact-casino-symbol-xeno
    entity: CMXenoLarva
    color: "#B05CFF"
    weight: 4
    three: 20
  - name: mriya-contact-casino-symbol-bar
    entity: CMSheetMetal1
    color: "#FFFFFF"
    weight: 6
    three: 10
  - name: mriya-contact-casino-symbol-bell
    entity: MRPlushieSteamhappy
    color: "#E0B040"
    weight: 8
    three: 6
  - name: mriya-contact-casino-symbol-cherry
    color: "#FF6FA0"
    entity: FoodCherry
    weight: 12
    three: 4
    two: 2
  blackjackBets: [ 5, 10, 25, 50, 100 ]
  blackjackSeats: 5
  blackjackDecks: 6
  bettingTime: 15
  turnTime: 20
  resultsTime: 6

# Slot machine: RMC's Hybrisa prop, made playable
- type: entity
  parent: RMCPropSlotmachineIdle
  id: MRContactSlotMachine
  name: ігровий автомат
  suffix: Контакт
  description: Депни Є-бали, потягни за важіль, розчаруйся.
  components:
  - type: ContactCasino
    slots: true
    blackjack: false
  - type: ActivatableUI
    key: enum.ContactCasinoUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ContactCasinoUiKey.Key:
        type: ContactCasinoBoundUserInterface

# Blackjack table. Every table (and the store) is the same shared game.
- type: entity
  parent: CMTableWoodenGambling
  id: MRContactBlackjackTable
  name: стіл для блекджеку
  suffix: Контакт
  description: Ділер ніколи не спить. Його тут навіть немає. Він навіть не людина... :steamhappy:.
  components:
  - type: ContactCasino
    slots: false
    blackjack: true
  - type: ActivatableUI
    key: enum.ContactCasinoUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ContactCasinoUiKey.Key:
        type: ContactCasinoBoundUserInterface