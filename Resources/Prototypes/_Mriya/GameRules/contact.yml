
- type: entity
  id: MRContactDistress
  parent: CMDistressSignal
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 0
  - type: CMDistressSignalRule
    requireXenoPlayers: false
    spawnXenos: false
    spawnSurvivors: false
    autoEnd: false
    bioscan: false
    startARESAnnouncements: true
    doJobSlotScaling: false
    lastMarineEffects: false
 
- type: entity
  id: MRContactRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: ContactRule
    announcementPreset: MRARES
  - type: ContactEconomy
    killReward: 5
    healReward: 3
    healStep: 20
    reviveReward: 25
    terminalReward: 15
  - type: ContactShuttle
    boardingCountdown: 120
    fullBoardCountdown: 30
    unloadTime: 15
    refuelTime: 150
  - type: ContactExtraction
    everyWaves: 10
    breakTime: 45
    zoneRadius: 10
    startCountdown: 10
    holdTime: 150
    holdWaveInterval: 20
    boardTime: 30
 
- type: gamePreset
  id: MRContact
  alias: [ contact ]
  name: mriya-contact-title
  description: mriya-contact-description
  showInVote: false
  rules:
  - MRContactDistress
  - MRContactRule
  - MRRespawnRule
  - MRRotRuleContact

- type: contactWaves
  id: MRContactWavesDefault
  spawns:
  - proto: CMXenoDrone
    startWave: 1
    rate: 2
    ratePerWave: 0.2
    maxAlive: 15
  - proto: CMXenoRunner
    startWave: 5
    rate: 0.5
    ratePerWave: 0.1
    maxAlive: 8
  - proto: CMXenoDefender
    startWave: 15
    rate: 0.34
    ratePerWave: 0.05
    maxAlive: 4
  - proto: CMXenoWarrior
    startWave: 30
    rate: 0.25
    ratePerWave: 0.05
    maxAlive: 3
  # - proto: CMXenoQueen # boss example, spawns only at wave 20
  #   startWave: 20
  #   rate: 1
  #   ratePerWave: -1
  #   maxAlive: 1
  buffs:
  - wave: 20
    health: 1.25 # + 25% from BASE
    damage: 1.1
    # announcement: pruvit
  - wave: 40
    health: 1.5 # + 50% from BASE, not from 125%
    damage: 1.25
  - wave: 60
    health: 2
    damage: 1.5
  - wave: 80
    health: 2.5
    damage: 1.75

- type: entity
  parent: BaseGameRule
  id: MRRotRuleContact
  categories: [ HideSpawnMenu ]
  components:
  - type: MRRotRule
    rotTime: 10